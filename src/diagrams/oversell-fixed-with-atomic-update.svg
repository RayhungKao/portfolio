<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img"><title>Atomic update prevents overselling</title><desc>Request A and request B each send one statement that decrements stock only if stock is at least 1. The database changes one row for A, so A gets 201 order created. B finds zero rows changed and gets 409 sold out.</desc><defs><marker id="arrow-oversell-fixed-with-atomic-update" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="50" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="120" y="36" text-anchor="middle" dominant-baseline="central">Request A</text></g>
<g class="c-teal"><rect x="270" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Database</text></g>
<g class="c-purple"><rect x="490" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="560" y="36" text-anchor="middle" dominant-baseline="central">Request B</text></g>
<line x1="120" y1="60" x2="120" y2="206" class="leader"/><line x1="340" y1="60" x2="340" y2="206" class="leader"/><line x1="560" y1="60" x2="560" y2="206" class="leader"/>
<line x1="124" y1="96" x2="336" y2="96" class="arr" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/><text class="ts" x="230" y="90" text-anchor="middle">1. decrement if stock &gt;= 1</text>
<line x1="336" y1="124" x2="124" y2="124" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/><text class="ts" x="230" y="118" text-anchor="middle">1 row changed</text>
<line x1="556" y1="164" x2="344" y2="164" class="arr" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/><text class="ts" x="450" y="158" text-anchor="middle">2. decrement if stock &gt;= 1</text>
<line x1="344" y1="192" x2="556" y2="192" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/><text class="ts" x="450" y="186" text-anchor="middle">0 rows changed</text>
<line x1="120" y1="210" x2="120" y2="226" class="arr" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/><line x1="560" y1="210" x2="560" y2="226" class="arr" stroke="#D85A30" marker-end="url(#arrow-oversell-fixed-with-atomic-update)"/>
<g class="c-teal"><rect x="50" y="230" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="120" y="245" text-anchor="middle" dominant-baseline="central">201</text><text class="ts" x="120" y="262" text-anchor="middle" dominant-baseline="central">Order created</text></g>
<g class="c-coral"><rect x="490" y="230" width="140" height="44" rx="8" stroke-width="0.5"/><text class="th" x="560" y="245" text-anchor="middle" dominant-baseline="central">409</text><text class="ts" x="560" y="262" text-anchor="middle" dominant-baseline="central">Sold out</text></g></svg>
