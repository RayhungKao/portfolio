<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img"><title>Polling, Server-Sent Events and WebSocket compared</title><desc>Three side-by-side sequence diagrams. Polling: the browser repeatedly asks the server whether there is anything new and the server answers each time. Server-Sent Events: the browser sends one request and the server streams events back over time, in one direction only. WebSocket: the browser opens a connection once and then both sides can send messages at any time.</desc>
<defs><marker id="ah3-polling-sse-websocket" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="230" y1="10" x2="230" y2="225" class="leader"/>
<line x1="450" y1="10" x2="450" y2="225" class="leader"/>
<text class="th" x="120" y="22" text-anchor="middle">Polling</text>
<text class="ts" x="120" y="40" text-anchor="middle">Ask again and again</text>
<text class="th" x="340" y="22" text-anchor="middle">Server-Sent Events</text>
<text class="ts" x="340" y="40" text-anchor="middle">One request, server streams</text>
<text class="th" x="560" y="22" text-anchor="middle">WebSocket</text>
<text class="ts" x="560" y="40" text-anchor="middle">Both sides can send</text>
<g class="c-gray"><rect x="15" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="45" y="68" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<g class="c-purple"><rect x="165" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="195" y="68" text-anchor="middle" dominant-baseline="central">Server</text></g>
<line x1="45" y1="82" x2="45" y2="218" class="leader"/>
<line x1="195" y1="82" x2="195" y2="218" class="leader"/>
<text class="ts" x="120" y="108" text-anchor="middle">New?</text>
<line x1="48" y1="114" x2="192" y2="114" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="120" y="134" text-anchor="middle">No</text>
<line x1="192" y1="140" x2="48" y2="140" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="120" y="166" text-anchor="middle">New?</text>
<line x1="48" y1="172" x2="192" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="120" y="192" text-anchor="middle">Yes</text>
<line x1="192" y1="198" x2="48" y2="198" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<g class="c-gray"><rect x="235" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="265" y="68" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<g class="c-purple"><rect x="385" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="415" y="68" text-anchor="middle" dominant-baseline="central">Server</text></g>
<line x1="265" y1="82" x2="265" y2="218" class="leader"/>
<line x1="415" y1="82" x2="415" y2="218" class="leader"/>
<text class="ts" x="340" y="108" text-anchor="middle">One request</text>
<line x1="268" y1="114" x2="412" y2="114" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="340" y="152" text-anchor="middle">Event 1</text>
<line x1="412" y1="158" x2="268" y2="158" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="340" y="190" text-anchor="middle">Event 2</text>
<line x1="412" y1="196" x2="268" y2="196" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<g class="c-gray"><rect x="455" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="485" y="68" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<g class="c-purple"><rect x="605" y="54" width="60" height="28" rx="6" stroke-width="0.5"/><text class="ts" x="635" y="68" text-anchor="middle" dominant-baseline="central">Server</text></g>
<line x1="485" y1="82" x2="485" y2="218" class="leader"/>
<line x1="635" y1="82" x2="635" y2="218" class="leader"/>
<text class="ts" x="560" y="108" text-anchor="middle">Open (once)</text>
<line x1="488" y1="114" x2="632" y2="114" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="560" y="146" text-anchor="middle">Event 1</text>
<line x1="632" y1="152" x2="488" y2="152" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="560" y="182" text-anchor="middle">Browser sends</text>
<line x1="488" y1="188" x2="632" y2="188" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah3-polling-sse-websocket)"/>
<text class="ts" x="120" y="244" text-anchor="middle">Simple, wasteful.</text>
<text class="ts" x="120" y="262" text-anchor="middle">Example: order status</text>
<text class="ts" x="120" y="280" text-anchor="middle">checked every 10 s.</text>
<text class="ts" x="340" y="244" text-anchor="middle">One-way, plain HTTP.</text>
<text class="ts" x="340" y="262" text-anchor="middle">Example: an AI reply</text>
<text class="ts" x="340" y="280" text-anchor="middle">streaming in.</text>
<text class="ts" x="560" y="244" text-anchor="middle">Two-way, most flexible.</text>
<text class="ts" x="560" y="262" text-anchor="middle">Example: chat messages,</text>
<text class="ts" x="560" y="280" text-anchor="middle">rider location.</text></svg>
