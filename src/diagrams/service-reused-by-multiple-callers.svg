<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img"><title>One service reused by several entry points</title><desc>A route handler, a server action, and an admin script all call the same createOrder service, which uses the data access layer.</desc>
<defs><marker id="arrow-service-reused-by-multiple-callers" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="30" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="110" y="46" text-anchor="middle" dominant-baseline="central">Route Handler</text><text class="ts" x="110" y="64" text-anchor="middle" dominant-baseline="central">Mobile app API</text></g>
<g class="c-gray"><rect x="30" y="100" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="110" y="116" text-anchor="middle" dominant-baseline="central">Server Action</text><text class="ts" x="110" y="134" text-anchor="middle" dominant-baseline="central">Web checkout form</text></g>
<g class="c-gray"><rect x="30" y="170" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="110" y="186" text-anchor="middle" dominant-baseline="central">Admin script</text><text class="ts" x="110" y="204" text-anchor="middle" dominant-baseline="central">Order for a customer</text></g>
<g class="c-purple"><rect x="290" y="100" width="160" height="48" rx="8" stroke-width="0.5"/><text class="th" x="370" y="116" text-anchor="middle" dominant-baseline="central">createOrder()</text><text class="ts" x="370" y="134" text-anchor="middle" dominant-baseline="central">Business rules</text></g>
<g class="c-purple"><rect x="530" y="100" width="120" height="48" rx="8" stroke-width="0.5"/><text class="th" x="590" y="116" text-anchor="middle" dominant-baseline="central">Data access</text><text class="ts" x="590" y="134" text-anchor="middle" dominant-baseline="central">Talks to the DB</text></g>
<line x1="190" y1="54" x2="288" y2="112" class="arr" marker-end="url(#arrow-service-reused-by-multiple-callers)"/>
<line x1="190" y1="124" x2="288" y2="124" class="arr" marker-end="url(#arrow-service-reused-by-multiple-callers)"/>
<line x1="190" y1="194" x2="288" y2="136" class="arr" marker-end="url(#arrow-service-reused-by-multiple-callers)"/>
<line x1="450" y1="124" x2="528" y2="124" class="arr" marker-end="url(#arrow-service-reused-by-multiple-callers)"/>
</svg>
