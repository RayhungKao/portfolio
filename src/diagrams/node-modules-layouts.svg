<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 285" role="img"><title>npm keeps a copy per project; pnpm links projects to one store</title><desc>On the left, npm and hoisted Yarn Classic give project A and project B each their own node_modules folder, each holding react and lodash, so every project has its own copy. On the right, pnpm keeps one global store holding react and lodash and project A and project B link to it, so there is one copy on disk.</desc><defs><marker id="arrow-node-modules-layouts" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="170" y="20" text-anchor="middle">npm / Yarn Classic (hoisted)</text>
<text class="th" x="510" y="20" text-anchor="middle">pnpm (content-addressable store)</text>
<rect x="20" y="36" width="300" height="92" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="170" y="58" text-anchor="middle">Project A: node_modules</text>
<g class="c-gray"><rect x="40" y="74" width="120" height="36" rx="8" stroke-width="0.5"/><text class="th" x="100" y="92" text-anchor="middle" dominant-baseline="central">react</text></g>
<g class="c-gray"><rect x="180" y="74" width="120" height="36" rx="8" stroke-width="0.5"/><text class="th" x="240" y="92" text-anchor="middle" dominant-baseline="central">lodash</text></g>
<rect x="20" y="140" width="300" height="92" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="170" y="162" text-anchor="middle">Project B: node_modules</text>
<g class="c-gray"><rect x="40" y="178" width="120" height="36" rx="8" stroke-width="0.5"/><text class="th" x="100" y="196" text-anchor="middle" dominant-baseline="central">react</text></g>
<g class="c-gray"><rect x="180" y="178" width="120" height="36" rx="8" stroke-width="0.5"/><text class="th" x="240" y="196" text-anchor="middle" dominant-baseline="central">lodash</text></g>
<text class="ts" x="170" y="262" text-anchor="middle">Each project holds its own copy</text>
<g class="c-teal"><rect x="350" y="36" width="310" height="92" rx="8" stroke-width="0.5"/><text class="th" x="505" y="55" text-anchor="middle" dominant-baseline="central">Global store</text><text class="ts" x="505" y="73" text-anchor="middle" dominant-baseline="central"></text><text class="ts" x="505" y="91" text-anchor="middle" dominant-baseline="central"></text><text class="ts" x="505" y="109" text-anchor="middle" dominant-baseline="central"></text></g>
<g class="c-gray"><rect x="370" y="78" width="130" height="36" rx="8" stroke-width="0.5"/><text class="th" x="435" y="96" text-anchor="middle" dominant-baseline="central">react</text></g>
<g class="c-gray"><rect x="510" y="78" width="130" height="36" rx="8" stroke-width="0.5"/><text class="th" x="575" y="96" text-anchor="middle" dominant-baseline="central">lodash</text></g>
<g class="c-gray"><rect x="350" y="170" width="145" height="70" rx="8" stroke-width="0.5"/><text class="th" x="422.5" y="196" text-anchor="middle" dominant-baseline="central">Project A</text><text class="ts" x="422.5" y="214" text-anchor="middle" dominant-baseline="central">links to the store</text></g>
<g class="c-gray"><rect x="515" y="170" width="145" height="70" rx="8" stroke-width="0.5"/><text class="th" x="587.5" y="196" text-anchor="middle" dominant-baseline="central">Project B</text><text class="ts" x="587.5" y="214" text-anchor="middle" dominant-baseline="central">links to the store</text></g>
<line x1="422" y1="168" x2="422" y2="132" class="arr" marker-end="url(#arrow-node-modules-layouts)"/>
<line x1="587" y1="168" x2="587" y2="132" class="arr" marker-end="url(#arrow-node-modules-layouts)"/>
<text class="ts" x="510" y="262" text-anchor="middle">One copy on disk; projects link to it</text></svg>