<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img"><title>Three ways to get realtime updates</title><desc>Three rows. Row one: a database row changes, Supabase Realtime watches it and pushes to the browser over a WebSocket. Row two: your serverless function sends a short HTTP publish call to Ably or Pusher, which pushes to the browser over a WebSocket. Row three: one browser sends to your own WebSocket server, which pushes to another browser, with both connections held open by your server.</desc>
<defs><marker id="ah2-three-ways-to-realtime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="20">1  Supabase Realtime</text>
<g class="c-teal"><rect x="40" y="34" width="140" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="110" y="52" text-anchor="middle" dominant-baseline="central">Your database</text></g>
<g class="c-gray"><rect x="270" y="34" width="160" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="350" y="52" text-anchor="middle" dominant-baseline="central">Supabase Realtime</text></g>
<g class="c-gray"><rect x="520" y="34" width="120" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="52" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<text class="ts" x="225" y="46" text-anchor="middle">row changes</text>
<line x1="182" y1="52" x2="268" y2="52" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="475" y="46" text-anchor="middle">WebSocket</text>
<line x1="432" y1="52" x2="518" y2="52" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="40" y="94">You write: just the subscribe code. Example: a notes list that updates live.</text>
<line x1="40" y1="112" x2="640" y2="112" class="leader"/>
<text class="th" x="40" y="140">2  Ably or Pusher</text>
<g class="c-purple"><rect x="40" y="154" width="140" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="110" y="172" text-anchor="middle" dominant-baseline="central">Your function</text></g>
<g class="c-gray"><rect x="270" y="154" width="160" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="350" y="172" text-anchor="middle" dominant-baseline="central">Ably or Pusher</text></g>
<g class="c-gray"><rect x="520" y="154" width="120" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="172" text-anchor="middle" dominant-baseline="central">Browser</text></g>
<text class="ts" x="225" y="166" text-anchor="middle">HTTP publish</text>
<line x1="182" y1="172" x2="268" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="475" y="166" text-anchor="middle">WebSocket</text>
<line x1="432" y1="172" x2="518" y2="172" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="40" y="214">You write: one short HTTP call. Example: a webhook function tells the page "paid".</text>
<text class="ts" x="40" y="232">Your function never holds a connection, so the time limit does not matter.</text>
<line x1="40" y1="250" x2="640" y2="250" class="leader"/>
<text class="th" x="40" y="278">3  Own WebSocket</text>
<g class="c-gray"><rect x="40" y="292" width="140" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="110" y="310" text-anchor="middle" dominant-baseline="central">Browser A</text></g>
<g class="c-purple"><rect x="270" y="292" width="160" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="350" y="310" text-anchor="middle" dominant-baseline="central">Your WebSocket server</text></g>
<g class="c-gray"><rect x="520" y="292" width="120" height="36" rx="6" stroke-width="0.5"/><text class="ts" x="580" y="310" text-anchor="middle" dominant-baseline="central">Browser B</text></g>
<text class="ts" x="225" y="304" text-anchor="middle">WebSocket</text>
<line x1="182" y1="310" x2="268" y2="310" stroke="var(--b)" stroke-width="1.5" marker-start="url(#ah2-three-ways-to-realtime)" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="475" y="304" text-anchor="middle">WebSocket</text>
<line x1="432" y1="310" x2="518" y2="310" stroke="var(--b)" stroke-width="1.5" marker-start="url(#ah2-three-ways-to-realtime)" marker-end="url(#ah2-three-ways-to-realtime)"/>
<text class="ts" x="40" y="352">You write and run the server that holds every connection open.</text>
<text class="ts" x="40" y="370">Example: chat messages, rider location.</text>
<text class="ts" x="40" y="392">Purple: you write or run it. Gray: a provider runs it. Teal: where your data lives.</text></svg>
