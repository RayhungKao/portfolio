<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 375" role="img"><title>Optimistic locking with a version number</title><desc>User A and user B both load a file at version 3. A saves expecting version 3 and the database moves it to version 4. B then saves also expecting version 3, but the file is now at version 4, so zero rows change and B gets a 409 conflict, which shows a conflict dialog.</desc><defs><marker id="arrow-optimistic-locking-conflict" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="50" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="120" y="36" text-anchor="middle" dominant-baseline="central">User A</text></g>
<g class="c-teal"><rect x="270" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Database</text></g>
<g class="c-gray"><rect x="490" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="560" y="36" text-anchor="middle" dominant-baseline="central">User B</text></g>
<line x1="120" y1="60" x2="120" y2="296" class="leader"/><line x1="340" y1="60" x2="340" y2="296" class="leader"/><line x1="560" y1="60" x2="560" y2="296" class="leader"/>
<line x1="336" y1="96" x2="124" y2="96" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="230" y="90" text-anchor="middle">A loads: version 3</text>
<line x1="344" y1="136" x2="556" y2="136" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="450" y="130" text-anchor="middle">B loads: version 3</text>
<line x1="124" y1="184" x2="336" y2="184" class="arr" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="230" y="178" text-anchor="middle">A saves, expects v3</text>
<line x1="336" y1="208" x2="124" y2="208" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="230" y="202" text-anchor="middle">ok, now version 4</text>
<line x1="556" y1="256" x2="344" y2="256" class="arr" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="450" y="250" text-anchor="middle">B saves, expects v3</text>
<line x1="344" y1="280" x2="556" y2="280" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-optimistic-locking-conflict)"/><text class="ts" x="450" y="274" text-anchor="middle">0 rows changed: 409</text>
<line x1="560" y1="300" x2="560" y2="316" class="arr" stroke="#D85A30" marker-end="url(#arrow-optimistic-locking-conflict)"/>
<g class="c-coral"><rect x="475" y="320" width="170" height="44" rx="8" stroke-width="0.5"/><text class="th" x="560" y="335" text-anchor="middle" dominant-baseline="central">Conflict dialog</text><text class="ts" x="560" y="352" text-anchor="middle" dominant-baseline="central">Reload, merge, overwrite</text></g></svg>
