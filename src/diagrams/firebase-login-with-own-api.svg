<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 225" role="img"><title>Firebase for login only, own API for data</title><desc>The browser logs in with Firebase Auth and gets an ID token. It sends the token to your own API in a header. Your API verifies the token with Firebase and then queries your own PostgreSQL database.</desc><defs><marker id="arrow-firebase-login-with-own-api" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="40" y="28">1. Log in, get an ID token</text>
<g class="c-gray"><rect x="185" y="44" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="245" y="64" text-anchor="middle" dominant-baseline="central">Firebase Auth</text><text class="ts" x="245" y="82" text-anchor="middle" dominant-baseline="central">Login only</text></g>
<g class="c-gray"><rect x="40" y="110" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="100" y="130" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="100" y="148" text-anchor="middle" dominant-baseline="central">Holds the token</text></g>
<g class="c-purple"><rect x="330" y="110" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="390" y="130" text-anchor="middle" dominant-baseline="central">Your API</text><text class="ts" x="390" y="148" text-anchor="middle" dominant-baseline="central">Rules and logic</text></g>
<g class="c-teal"><rect x="520" y="110" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="130" text-anchor="middle" dominant-baseline="central">PostgreSQL</text><text class="ts" x="580" y="148" text-anchor="middle" dominant-baseline="central">Your own data</text></g>
<path d="M100 106 L100 72 L181 72" fill="none" class="arr" marker-start="url(#arrow-firebase-login-with-own-api)" marker-end="url(#arrow-firebase-login-with-own-api)"/>
<line x1="164" y1="138" x2="326" y2="138" class="arr" marker-end="url(#arrow-firebase-login-with-own-api)"/><text class="ts" x="245" y="132" text-anchor="middle">2. Send token to API</text>
<path d="M390 106 L390 72 L309 72" fill="none" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-firebase-login-with-own-api)"/><text class="ts" x="400" y="76">3. Verify the token</text>
<line x1="454" y1="138" x2="516" y2="138" class="arr" marker-end="url(#arrow-firebase-login-with-own-api)"/><text class="ts" x="485" y="132" text-anchor="middle">4. Query</text>
<text class="ts" x="40" y="204">Only login is rented. The data and the rules stay in your own API and database.</text></svg>
