<svg data-narrow xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 360" role="img"><title>Middleware chain with a short-circuit</title><desc>A request passes through logging, body parsing, and authentication before reaching the handler. If authentication fails, the chain stops with a 401 response.</desc>
<defs><marker id="arrow-middleware-chain-with-short-circuit" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="20" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="36" text-anchor="middle" dominant-baseline="central">Request</text><text class="ts" x="120" y="54" text-anchor="middle" dominant-baseline="central">POST /api/orders</text></g>
<g class="c-purple"><rect x="30" y="88" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="104" text-anchor="middle" dominant-baseline="central">Logging</text><text class="ts" x="120" y="122" text-anchor="middle" dominant-baseline="central">Record method, path</text></g>
<g class="c-purple"><rect x="30" y="156" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="172" text-anchor="middle" dominant-baseline="central">Body parsing</text><text class="ts" x="120" y="190" text-anchor="middle" dominant-baseline="central">JSON into req.body</text></g>
<g class="c-purple"><rect x="30" y="224" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="240" text-anchor="middle" dominant-baseline="central">Authentication</text><text class="ts" x="120" y="258" text-anchor="middle" dominant-baseline="central">Who is this? Set req.user</text></g>
<g class="c-purple"><rect x="30" y="292" width="180" height="48" rx="8" stroke-width="0.5"/><text class="th" x="120" y="308" text-anchor="middle" dominant-baseline="central">Handler</text><text class="ts" x="120" y="326" text-anchor="middle" dominant-baseline="central">Runs only if all pass</text></g>
<g class="c-coral"><rect x="240" y="224" width="110" height="48" rx="8" stroke-width="0.5"/><text class="th" x="295" y="240" text-anchor="middle" dominant-baseline="central">Reject</text><text class="ts" x="295" y="258" text-anchor="middle" dominant-baseline="central">401 response</text></g>
<line x1="120" y1="70" x2="120" y2="86" class="arr" marker-end="url(#arrow-middleware-chain-with-short-circuit)"/>
<line x1="120" y1="138" x2="120" y2="154" class="arr" marker-end="url(#arrow-middleware-chain-with-short-circuit)"/>
<line x1="120" y1="206" x2="120" y2="222" class="arr" marker-end="url(#arrow-middleware-chain-with-short-circuit)"/>
<line x1="120" y1="274" x2="120" y2="290" class="arr" marker-end="url(#arrow-middleware-chain-with-short-circuit)"/>
<line x1="212" y1="248" x2="238" y2="248" class="arr" marker-end="url(#arrow-middleware-chain-with-short-circuit)"/>
</svg>
