<svg data-narrow xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 350" role="img"><title>Safe retry after a lost response</title><desc>The client sends a request with key K and the server commits it, but the response is lost. The client retries with the same key and the server returns the stored result instead of doing the action again.</desc>
<text class="th" x="100" y="22" text-anchor="middle">Client</text>
<text class="th" x="280" y="22" text-anchor="middle">Server</text>
<g class="c-purple"><rect x="15" y="40" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="100" y="56" text-anchor="middle" dominant-baseline="central">1. Send request</text><text class="ts" x="100" y="74" text-anchor="middle" dominant-baseline="central">Idempotency key K</text></g>
<g class="c-teal"><rect x="195" y="102" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="280" y="118" text-anchor="middle" dominant-baseline="central">2. Commit</text><text class="ts" x="280" y="136" text-anchor="middle" dominant-baseline="central">Then send 2xx</text></g>
<g class="c-coral"><rect x="15" y="164" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="100" y="180" text-anchor="middle" dominant-baseline="central">3. No response</text><text class="ts" x="100" y="198" text-anchor="middle" dominant-baseline="central">Connection dropped</text></g>
<g class="c-purple"><rect x="15" y="226" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="100" y="242" text-anchor="middle" dominant-baseline="central">4. Retry</text><text class="ts" x="100" y="260" text-anchor="middle" dominant-baseline="central">Same key K</text></g>
<g class="c-teal"><rect x="195" y="288" width="170" height="48" rx="8" stroke-width="0.5"/><text class="th" x="280" y="304" text-anchor="middle" dominant-baseline="central">5. Key K already seen</text><text class="ts" x="280" y="322" text-anchor="middle" dominant-baseline="central">Return stored result</text></g>
</svg>
