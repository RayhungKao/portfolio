<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img"><title>The dev server works file by file; the build works on everything</title><desc>Two columns. Development: the browser asks for a file as a native ES module, the dev server compiles just that file without bundling first, and the browser runs the result while hot module replacement swaps changed modules. Build: a bundler follows every import across the whole project, then compiles, tree-shakes, splits and minifies for size, and writes a dist folder with hashed files ready to deploy.</desc><defs><marker id="arrow-dev-vs-build" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="175" y="20" text-anchor="middle">Development</text>
<text class="th" x="505" y="20" text-anchor="middle">Build</text>
<g class="c-gray"><rect x="20" y="36" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="175" y="59" text-anchor="middle" dominant-baseline="central">Browser asks for a file</text><text class="ts" x="175" y="77" text-anchor="middle" dominant-baseline="central">native ES modules</text></g>
<g class="c-purple"><rect x="350" y="36" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="505" y="59" text-anchor="middle" dominant-baseline="central">Bundler follows every import</text><text class="ts" x="505" y="77" text-anchor="middle" dominant-baseline="central">the whole project at once</text></g>
<line x1="175" y1="102" x2="175" y2="122" class="arr" marker-end="url(#arrow-dev-vs-build)"/>
<line x1="505" y1="102" x2="505" y2="122" class="arr" marker-end="url(#arrow-dev-vs-build)"/>
<g class="c-gray"><rect x="20" y="124" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="175" y="147" text-anchor="middle" dominant-baseline="central">Dev server compiles that file</text><text class="ts" x="175" y="165" text-anchor="middle" dominant-baseline="central">no full bundle first</text></g>
<g class="c-purple"><rect x="350" y="124" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="505" y="147" text-anchor="middle" dominant-baseline="central">Compile, shake, split, minify</text><text class="ts" x="505" y="165" text-anchor="middle" dominant-baseline="central">optimized for size</text></g>
<line x1="175" y1="190" x2="175" y2="210" class="arr" marker-end="url(#arrow-dev-vs-build)"/>
<line x1="505" y1="190" x2="505" y2="210" class="arr" marker-end="url(#arrow-dev-vs-build)"/>
<g class="c-gray"><rect x="20" y="212" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="175" y="235" text-anchor="middle" dominant-baseline="central">Browser runs the result</text><text class="ts" x="175" y="253" text-anchor="middle" dominant-baseline="central">HMR swaps changed modules</text></g>
<g class="c-teal"><rect x="350" y="212" width="310" height="64" rx="8" stroke-width="0.5"/><text class="th" x="505" y="235" text-anchor="middle" dominant-baseline="central">dist/ with hashed files</text><text class="ts" x="505" y="253" text-anchor="middle" dominant-baseline="central">ready to deploy</text></g></svg>