<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>Layers around incoming and outgoing requests</title><desc>Two columns. Incoming, where the backend is the server: a browser or another service sends a request, middleware checks it, and the handler runs only if the checks pass. Outgoing, where the backend is the client: your code sends a request, transport layers check, retry or rewrite it, and only then does it reach the remote site. Both sides wrap layers around the core and can stop early.</desc>
<defs><marker id="arrow-server-and-client-layers" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="340" y1="10" x2="340" y2="300" class="leader"/>
<text class="th" x="170" y="22" text-anchor="middle">Incoming: you are the server</text>
<text class="ts" x="170" y="40" text-anchor="middle">Someone calls your backend</text>
<text class="th" x="510" y="22" text-anchor="middle">Outgoing: you are the client</text>
<text class="ts" x="510" y="40" text-anchor="middle">Your backend calls someone</text>
<g class="c-gray"><rect x="40" y="58" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="74" text-anchor="middle" dominant-baseline="central">Browser or another service</text><text class="ts" x="170" y="92" text-anchor="middle" dominant-baseline="central">POST /api/orders</text></g>
<g class="c-purple"><rect x="40" y="132" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="148" text-anchor="middle" dominant-baseline="central">Middleware</text><text class="ts" x="170" y="166" text-anchor="middle" dominant-baseline="central">Logged in? Log it. Can stop with 401</text></g>
<g class="c-purple"><rect x="40" y="206" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="170" y="222" text-anchor="middle" dominant-baseline="central">Handler</text><text class="ts" x="170" y="240" text-anchor="middle" dominant-baseline="central">Runs only if the checks pass</text></g>
<g class="c-purple"><rect x="380" y="58" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="510" y="74" text-anchor="middle" dominant-baseline="central">Your code</text><text class="ts" x="510" y="92" text-anchor="middle" dominant-baseline="central">client.Get(url)</text></g>
<g class="c-teal"><rect x="380" y="132" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="510" y="148" text-anchor="middle" dominant-baseline="central">Transport layers</text><text class="ts" x="510" y="166" text-anchor="middle" dominant-baseline="central">Guard, retry, proxy. Can refuse to send</text></g>
<g class="c-gray"><rect x="380" y="206" width="260" height="48" rx="8" stroke-width="0.5"/><text class="th" x="510" y="222" text-anchor="middle" dominant-baseline="central">Remote site or API</text><text class="ts" x="510" y="240" text-anchor="middle" dominant-baseline="central">Database, payment API, a site</text></g>
<line x1="170" y1="108" x2="170" y2="130" class="arr" marker-end="url(#arrow-server-and-client-layers)"/>
<line x1="170" y1="182" x2="170" y2="204" class="arr" marker-end="url(#arrow-server-and-client-layers)"/>
<line x1="510" y1="108" x2="510" y2="130" class="arr" marker-end="url(#arrow-server-and-client-layers)"/>
<line x1="510" y1="182" x2="510" y2="204" class="arr" marker-end="url(#arrow-server-and-client-layers)"/>
<text class="ts" x="170" y="284" text-anchor="middle">Go: wrap http.Handler · Express: app.use</text>
<text class="ts" x="510" y="284" text-anchor="middle">Go: wrap http.RoundTripper · axios: interceptors</text>
</svg>
