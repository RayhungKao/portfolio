<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"><title>From a Dockerfile to a running container</title><desc>docker build turns a Dockerfile into an image. docker run starts a container from the image on your own machine. docker push uploads the image to a registry, and a server or platform pulls it from there and runs its own container.</desc>
<defs><marker id="arrow-docker-build-push-run" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="20" y="50" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="85" y="68" text-anchor="middle" dominant-baseline="central">Dockerfile</text><text class="ts" x="85" y="88" text-anchor="middle" dominant-baseline="central">the recipe</text></g>
<g class="c-purple"><rect x="190" y="50" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="255" y="68" text-anchor="middle" dominant-baseline="central">Image</text><text class="ts" x="255" y="88" text-anchor="middle" dominant-baseline="central">read-only snapshot</text></g>
<g class="c-gray"><rect x="360" y="50" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="425" y="68" text-anchor="middle" dominant-baseline="central">Registry</text><text class="ts" x="425" y="88" text-anchor="middle" dominant-baseline="central">Docker Hub, GHCR</text></g>
<g class="c-purple"><rect x="530" y="50" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="595" y="68" text-anchor="middle" dominant-baseline="central">Container</text><text class="ts" x="595" y="88" text-anchor="middle" dominant-baseline="central">on a server or PaaS</text></g>
<g class="c-purple"><rect x="190" y="160" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="255" y="178" text-anchor="middle" dominant-baseline="central">Container</text><text class="ts" x="255" y="198" text-anchor="middle" dominant-baseline="central">on your machine</text></g>
<line x1="150" y1="78" x2="188" y2="78" class="arr" marker-end="url(#arrow-docker-build-push-run)"/>
<line x1="320" y1="78" x2="358" y2="78" class="arr" marker-end="url(#arrow-docker-build-push-run)"/>
<line x1="490" y1="78" x2="528" y2="78" class="arr" marker-end="url(#arrow-docker-build-push-run)"/>
<line x1="255" y1="106" x2="255" y2="158" class="arr" marker-end="url(#arrow-docker-build-push-run)"/>
<text class="ts" x="169" y="36" text-anchor="middle" dominant-baseline="central">build</text>
<text class="ts" x="339" y="36" text-anchor="middle" dominant-baseline="central">push</text>
<text class="ts" x="509" y="36" text-anchor="middle" dominant-baseline="central">pull, run</text>
<text class="ts" x="265" y="132" dominant-baseline="central">run</text>
<rect x="400" y="176" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><text class="ts" x="422" y="183" dominant-baseline="central">Your code</text>
<rect x="400" y="202" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><text class="ts" x="422" y="209" dominant-baseline="central">Not your code</text>
</svg>
