<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"><title>A router is four jobs, not just a switch</title><desc>A URL such as /blog/hello enters a router made of four jobs and a screen such as BlogPost comes out. The four jobs are matching, which turns the URL into a route object, rendering, which turns the route into a component, subscription, which listens to URL changes, and navigation, which uses pushState and handles link clicks.</desc><defs><marker id="arrow-router-four-jobs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="92" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="70" y="111" text-anchor="middle" dominant-baseline="central">URL</text><text class="ts" x="70" y="129" text-anchor="middle" dominant-baseline="central">/blog/hello</text></g>
<rect x="150" y="24" width="380" height="200" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="340" y="46" text-anchor="middle">Router</text>
<g class="c-purple"><rect x="166" y="62" width="170" height="70" rx="8" stroke-width="0.5"/><text class="th" x="251" y="88" text-anchor="middle" dominant-baseline="central">Matching</text><text class="ts" x="251" y="106" text-anchor="middle" dominant-baseline="central">URL to route object</text></g>
<g class="c-purple"><rect x="344" y="62" width="170" height="70" rx="8" stroke-width="0.5"/><text class="th" x="429" y="88" text-anchor="middle" dominant-baseline="central">Rendering</text><text class="ts" x="429" y="106" text-anchor="middle" dominant-baseline="central">route to component</text></g>
<g class="c-purple"><rect x="166" y="142" width="170" height="70" rx="8" stroke-width="0.5"/><text class="th" x="251" y="168" text-anchor="middle" dominant-baseline="central">Subscription</text><text class="ts" x="251" y="186" text-anchor="middle" dominant-baseline="central">listen to URL changes</text></g>
<g class="c-purple"><rect x="344" y="142" width="170" height="70" rx="8" stroke-width="0.5"/><text class="th" x="429" y="168" text-anchor="middle" dominant-baseline="central">Navigation</text><text class="ts" x="429" y="186" text-anchor="middle" dominant-baseline="central">pushState, link clicks</text></g>
<g class="c-gray"><rect x="560" y="92" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="610" y="111" text-anchor="middle" dominant-baseline="central">Screen</text><text class="ts" x="610" y="129" text-anchor="middle" dominant-baseline="central">e.g. BlogPost</text></g>
<line x1="122" y1="120" x2="148" y2="120" class="arr" marker-end="url(#arrow-router-four-jobs)"/>
<line x1="532" y1="120" x2="558" y2="120" class="arr" marker-end="url(#arrow-router-four-jobs)"/></svg>