<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img"><title>Cloudflare and Nginx layered together</title><desc>A browser request goes to Cloudflare, then to Nginx on your own server, which routes by path to a Next.js app and an Express API.</desc>
<defs><marker id="arrow-cloudflare-nginx-layered" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="310" y="24" width="350" height="218" rx="12" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="326" y="42" dominant-baseline="central">Your server</text>
<g class="c-gray"><rect x="20" y="105" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="70" y="123" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="70" y="143" text-anchor="middle" dominant-baseline="central">Client</text></g>
<g class="c-gray"><rect x="160" y="105" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="225" y="123" text-anchor="middle" dominant-baseline="central">Cloudflare</text><text class="ts" x="225" y="143" text-anchor="middle" dominant-baseline="central">Managed edge</text></g>
<g class="c-purple"><rect x="330" y="105" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="395" y="123" text-anchor="middle" dominant-baseline="central">Nginx</text><text class="ts" x="395" y="143" text-anchor="middle" dominant-baseline="central">You run it</text></g>
<g class="c-purple"><rect x="520" y="56" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="585" y="74" text-anchor="middle" dominant-baseline="central">Next.js</text><text class="ts" x="585" y="94" text-anchor="middle" dominant-baseline="central">path: /</text></g>
<g class="c-purple"><rect x="520" y="154" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="585" y="172" text-anchor="middle" dominant-baseline="central">Express API</text><text class="ts" x="585" y="192" text-anchor="middle" dominant-baseline="central">path: /api</text></g>
<line x1="120" y1="133" x2="158" y2="133" class="arr" marker-end="url(#arrow-cloudflare-nginx-layered)"/>
<line x1="290" y1="133" x2="328" y2="133" class="arr" marker-end="url(#arrow-cloudflare-nginx-layered)"/>
<line x1="460" y1="125" x2="518" y2="95" class="arr" marker-end="url(#arrow-cloudflare-nginx-layered)"/>
<line x1="460" y1="141" x2="518" y2="171" class="arr" marker-end="url(#arrow-cloudflare-nginx-layered)"/>
<rect x="20" y="266" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><text class="ts" x="42" y="273" dominant-baseline="central">Vendor operates</text>
<rect x="200" y="266" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><text class="ts" x="222" y="273" dominant-baseline="central">You operate</text>
</svg>
