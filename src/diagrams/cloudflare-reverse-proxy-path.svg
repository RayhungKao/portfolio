<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img"><title>Cloudflare as a reverse proxy</title><desc>Browser traffic passes through the Cloudflare edge, which does TLS termination, DDoS and WAF filtering, and caching, before reaching the origin.</desc>
<defs><marker id="arrow-cloudflare-reverse-proxy-path" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="90" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="90" y="108" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="90" y="128" text-anchor="middle" dominant-baseline="central">Client</text></g>
<g class="c-gray"><rect x="210" y="24" width="240" height="188" rx="12" stroke-width="0.5"/><text class="th" x="330" y="44" text-anchor="middle" dominant-baseline="central">Cloudflare edge</text><text class="ts" x="330" y="62" text-anchor="middle" dominant-baseline="central">Reverse proxy</text></g>
<rect x="230" y="78" width="200" height="36" rx="6" class="box" stroke-width="0.5"/><text class="t" x="330" y="96" text-anchor="middle" dominant-baseline="central">TLS termination</text>
<rect x="230" y="120" width="200" height="36" rx="6" class="box" stroke-width="0.5"/><text class="t" x="330" y="138" text-anchor="middle" dominant-baseline="central">DDoS / WAF filtering</text>
<rect x="230" y="162" width="200" height="36" rx="6" class="box" stroke-width="0.5"/><text class="t" x="330" y="180" text-anchor="middle" dominant-baseline="central">Cache static files</text>
<g class="c-purple"><rect x="510" y="90" width="140" height="56" rx="8" stroke-width="0.5"/><text class="th" x="580" y="108" text-anchor="middle" dominant-baseline="central">Origin</text><text class="ts" x="580" y="128" text-anchor="middle" dominant-baseline="central">Your backend</text></g>
<line x1="150" y1="118" x2="208" y2="118" class="arr" marker-end="url(#arrow-cloudflare-reverse-proxy-path)"/>
<line x1="450" y1="118" x2="508" y2="118" class="arr" marker-end="url(#arrow-cloudflare-reverse-proxy-path)"/>
</svg>
