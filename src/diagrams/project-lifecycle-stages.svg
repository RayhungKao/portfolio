<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" role="img"><title>Each stage optimizes for a different goal</title><desc>Four stages in order: install, development, build and deployment. Install gets dependencies with a package manager. Development gives fast feedback with a dev server and HMR. Build produces small fast files with a bundler and compiler. Deployment serves the files with a host, a CDN and CI.</desc><defs><marker id="arrow-project-lifecycle-stages" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="16" y="20" width="148" height="100" rx="8" stroke-width="0.5"/><text class="th" x="90" y="52" text-anchor="middle" dominant-baseline="central">Install</text><text class="ts" x="90" y="70" text-anchor="middle" dominant-baseline="central">Goal: get dependencies</text><text class="ts" x="90" y="88" text-anchor="middle" dominant-baseline="central">Package manager</text></g>
<line x1="166" y1="70" x2="182" y2="70" class="arr" marker-end="url(#arrow-project-lifecycle-stages)"/>
<g class="c-purple"><rect x="184" y="20" width="148" height="100" rx="8" stroke-width="0.5"/><text class="th" x="258" y="52" text-anchor="middle" dominant-baseline="central">Development</text><text class="ts" x="258" y="70" text-anchor="middle" dominant-baseline="central">Goal: fast feedback</text><text class="ts" x="258" y="88" text-anchor="middle" dominant-baseline="central">Dev server, HMR</text></g>
<line x1="334" y1="70" x2="350" y2="70" class="arr" marker-end="url(#arrow-project-lifecycle-stages)"/>
<g class="c-purple"><rect x="352" y="20" width="148" height="100" rx="8" stroke-width="0.5"/><text class="th" x="426" y="52" text-anchor="middle" dominant-baseline="central">Build</text><text class="ts" x="426" y="70" text-anchor="middle" dominant-baseline="central">Goal: small fast files</text><text class="ts" x="426" y="88" text-anchor="middle" dominant-baseline="central">Bundler, compiler</text></g>
<line x1="502" y1="70" x2="518" y2="70" class="arr" marker-end="url(#arrow-project-lifecycle-stages)"/>
<g class="c-purple"><rect x="520" y="20" width="148" height="100" rx="8" stroke-width="0.5"/><text class="th" x="594" y="52" text-anchor="middle" dominant-baseline="central">Deployment</text><text class="ts" x="594" y="70" text-anchor="middle" dominant-baseline="central">Goal: serve the files</text><text class="ts" x="594" y="88" text-anchor="middle" dominant-baseline="central">Host, CDN, CI</text></g></svg>