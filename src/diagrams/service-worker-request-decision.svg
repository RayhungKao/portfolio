<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img"><title>What a Service Worker can do with each request</title><desc>The page sends a request. The Service Worker's fetch event handler decides what to do. Option one: pass it through to the network, for example a checkout API call. Option two: answer from the cache, for example the app shell while offline. Option three: build its own response in code, for example an offline page.</desc>
<defs><marker id="ah6-service-worker-request-decision" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="20" y="110" width="100" height="44" rx="6" stroke-width="0.5"/><text class="th" x="70" y="124" text-anchor="middle" dominant-baseline="central">Page</text><text class="ts" x="70" y="140" text-anchor="middle" dominant-baseline="central">sends request</text></g>
<text class="ts" x="275" y="88" text-anchor="middle">decides for each request</text>
<g class="c-purple"><rect x="200" y="100" width="150" height="64" rx="6" stroke-width="0.5"/><text class="th" x="275" y="120" text-anchor="middle" dominant-baseline="central">Service Worker</text><text class="ts" x="275" y="142" text-anchor="middle" dominant-baseline="central">fetch event handler</text></g>
<line x1="122" y1="132" x2="198" y2="132" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah6-service-worker-request-decision)"/>
<g class="c-gray"><rect x="440" y="30" width="220" height="50" rx="6" stroke-width="0.5"/><text class="th" x="550" y="46" text-anchor="middle" dominant-baseline="central">1  Pass through</text><text class="ts" x="550" y="65" text-anchor="middle" dominant-baseline="central">e.g. a checkout API call</text></g>
<g class="c-teal"><rect x="440" y="105" width="220" height="50" rx="6" stroke-width="0.5"/><text class="th" x="550" y="121" text-anchor="middle" dominant-baseline="central">2  Answer from cache</text><text class="ts" x="550" y="140" text-anchor="middle" dominant-baseline="central">e.g. the app shell, offline</text></g>
<g class="c-purple"><rect x="440" y="180" width="220" height="50" rx="6" stroke-width="0.5"/><text class="th" x="550" y="196" text-anchor="middle" dominant-baseline="central">3  Build its own response</text><text class="ts" x="550" y="215" text-anchor="middle" dominant-baseline="central">e.g. an /offline page</text></g>
<line x1="352" y1="124" x2="438" y2="58" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah6-service-worker-request-decision)"/>
<line x1="352" y1="132" x2="438" y2="130" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah6-service-worker-request-decision)"/>
<line x1="352" y1="140" x2="438" y2="202" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah6-service-worker-request-decision)"/>
<text class="ts" x="20" y="262">Every request from the page goes through it first.</text>
<text class="ts" x="20" y="280">Only some requests ever reach the network.</text>
<text class="ts" x="20" y="306">Purple: you write it. Gray: outside your control. Teal: where your data lives.</text></svg>
