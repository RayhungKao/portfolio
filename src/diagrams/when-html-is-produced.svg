<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img"><title>CSR, SSG and SSR differ in when the HTML is produced</title><desc>A grid with rows CSR, SSG and SSR and columns build time, request time and in the browser. For CSR the page appears in the browser, where JavaScript builds it from an empty shell. For SSG the HTML is generated at build time, one file per route. For SSR the HTML is generated on every request.</desc><defs><marker id="arrow-when-html-is-produced" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="205" y="20" text-anchor="middle">Build time</text>
<text class="th" x="405" y="20" text-anchor="middle">Request time</text>
<text class="th" x="605" y="20" text-anchor="middle">In the browser</text>
<text class="th" x="20" y="67">CSR</text>
<g class="c-gray"><rect x="130" y="36" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="205" y="55" text-anchor="middle" dominant-baseline="central">Bundle the code</text><text class="ts" x="205" y="73" text-anchor="middle" dominant-baseline="central">no page HTML</text></g>
<g class="c-gray"><rect x="330" y="36" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="55" text-anchor="middle" dominant-baseline="central">Send an empty shell</text><text class="ts" x="405" y="73" text-anchor="middle" dominant-baseline="central">same file for every URL</text></g>
<g class="c-purple"><rect x="530" y="36" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="605" y="55" text-anchor="middle" dominant-baseline="central">JS builds the page</text><text class="ts" x="605" y="73" text-anchor="middle" dominant-baseline="central">content appears here</text></g>
<text class="th" x="20" y="139">SSG</text>
<g class="c-purple"><rect x="130" y="108" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="205" y="127" text-anchor="middle" dominant-baseline="central">Generate HTML</text><text class="ts" x="205" y="145" text-anchor="middle" dominant-baseline="central">one file per route</text></g>
<g class="c-gray"><rect x="330" y="108" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="127" text-anchor="middle" dominant-baseline="central">Send ready HTML</text><text class="ts" x="405" y="145" text-anchor="middle" dominant-baseline="central">no server work</text></g>
<g class="c-gray"><rect x="530" y="108" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="605" y="127" text-anchor="middle" dominant-baseline="central">JS adds interactivity</text><text class="ts" x="605" y="145" text-anchor="middle" dominant-baseline="central">hydration</text></g>
<text class="th" x="20" y="211">SSR</text>
<g class="c-gray"><rect x="130" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="205" y="199" text-anchor="middle" dominant-baseline="central">Bundle the code</text><text class="ts" x="205" y="217" text-anchor="middle" dominant-baseline="central">no page HTML</text></g>
<g class="c-purple"><rect x="330" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="405" y="199" text-anchor="middle" dominant-baseline="central">Generate HTML</text><text class="ts" x="405" y="217" text-anchor="middle" dominant-baseline="central">on every request</text></g>
<g class="c-gray"><rect x="530" y="180" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="605" y="199" text-anchor="middle" dominant-baseline="central">JS adds interactivity</text><text class="ts" x="605" y="217" text-anchor="middle" dominant-baseline="central">hydration</text></g>
<text class="ts" x="20" y="268">Purple: the moment the page HTML is produced.</text></svg>