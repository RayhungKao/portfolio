<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" role="img"><title>Hydration makes pre-rendered HTML interactive</title><desc>Two rows read left to right. For SSG or SSR the HTML arrives and content is visible, then JavaScript downloads and the page is not clickable yet, then hydration attaches handlers, then the page is interactive. For CSR an empty shell arrives, JavaScript downloads while the page is still blank, JavaScript renders the page from scratch, then it is interactive.</desc><defs><marker id="arrow-hydration-steps" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="ts" x="20" y="20">Time, left to right</text>
<text class="th" x="20" y="68">SSG / SSR</text>
<g class="c-gray"><rect x="130" y="36" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="55" text-anchor="middle" dominant-baseline="central">HTML arrives</text><text class="ts" x="190" y="73" text-anchor="middle" dominant-baseline="central">content visible</text></g>
<line x1="252" y1="64" x2="268" y2="64" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-gray"><rect x="270" y="36" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="330" y="55" text-anchor="middle" dominant-baseline="central">JS downloads</text><text class="ts" x="330" y="73" text-anchor="middle" dominant-baseline="central">not clickable yet</text></g>
<line x1="392" y1="64" x2="408" y2="64" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-purple"><rect x="410" y="36" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="55" text-anchor="middle" dominant-baseline="central">Hydration</text><text class="ts" x="470" y="73" text-anchor="middle" dominant-baseline="central">attaches handlers</text></g>
<line x1="532" y1="64" x2="548" y2="64" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-gray"><rect x="550" y="36" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="610" y="55" text-anchor="middle" dominant-baseline="central">Interactive</text><text class="ts" x="610" y="73" text-anchor="middle" dominant-baseline="central">clicks work</text></g>
<text class="th" x="20" y="152">CSR</text>
<g class="c-gray"><rect x="130" y="120" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="190" y="139" text-anchor="middle" dominant-baseline="central">Empty shell</text><text class="ts" x="190" y="157" text-anchor="middle" dominant-baseline="central">nothing to see</text></g>
<line x1="252" y1="148" x2="268" y2="148" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-gray"><rect x="270" y="120" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="330" y="139" text-anchor="middle" dominant-baseline="central">JS downloads</text><text class="ts" x="330" y="157" text-anchor="middle" dominant-baseline="central">still blank</text></g>
<line x1="392" y1="148" x2="408" y2="148" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-purple"><rect x="410" y="120" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="139" text-anchor="middle" dominant-baseline="central">JS renders</text><text class="ts" x="470" y="157" text-anchor="middle" dominant-baseline="central">built from scratch</text></g>
<line x1="532" y1="148" x2="548" y2="148" class="arr" marker-end="url(#arrow-hydration-steps)"/>
<g class="c-gray"><rect x="550" y="120" width="120" height="56" rx="8" stroke-width="0.5"/><text class="th" x="610" y="139" text-anchor="middle" dominant-baseline="central">Interactive</text><text class="ts" x="610" y="157" text-anchor="middle" dominant-baseline="central">clicks work</text></g>
<text class="ts" x="20" y="212">Purple: the step that makes the page interactive.</text></svg>