<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img"><title>Three caching strategies a Service Worker can use</title><desc>Three rows of three steps. Cache First: check the cache, return the copy if found, otherwise fetch from the network, save and return. Network First: try the network, return and save on success, use the cache if the network fails. Stale-while-revalidate: return the cached copy instantly, fetch in the background, update the cache so the next visit is fresh.</desc>
<defs><marker id="ah7-service-worker-cache-strategies" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="10" y="46" dominant-baseline="central">Cache First</text><text class="ts" x="10" y="64" dominant-baseline="central">e.g. logo, fonts</text>
<g class="c-teal"><rect x="190" y="30" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="256" y="46" text-anchor="middle" dominant-baseline="central">1  Check cache</text><text class="ts" x="256" y="64" text-anchor="middle" dominant-baseline="central">look for a copy</text></g>
<line x1="324" y1="54" x2="334" y2="54" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-teal"><rect x="336" y="30" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="402" y="46" text-anchor="middle" dominant-baseline="central">2  Found</text><text class="ts" x="402" y="64" text-anchor="middle" dominant-baseline="central">no network needed</text></g>
<line x1="470" y1="54" x2="480" y2="54" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-gray"><rect x="482" y="30" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="548" y="46" text-anchor="middle" dominant-baseline="central">3  Missing</text><text class="ts" x="548" y="64" text-anchor="middle" dominant-baseline="central">fetch, save, return</text></g>
<line x1="10" y1="98" x2="656" y2="98" class="leader"/>
<text class="th" x="10" y="136" dominant-baseline="central">Network First</text><text class="ts" x="10" y="154" dominant-baseline="central">e.g. product price</text>
<g class="c-gray"><rect x="190" y="120" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="256" y="136" text-anchor="middle" dominant-baseline="central">1  Try network</text><text class="ts" x="256" y="154" text-anchor="middle" dominant-baseline="central">ask the server first</text></g>
<line x1="324" y1="144" x2="334" y2="144" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-gray"><rect x="336" y="120" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="402" y="136" text-anchor="middle" dominant-baseline="central">2  Success</text><text class="ts" x="402" y="154" text-anchor="middle" dominant-baseline="central">return it and save</text></g>
<line x1="470" y1="144" x2="480" y2="144" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-teal"><rect x="482" y="120" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="548" y="136" text-anchor="middle" dominant-baseline="central">3  Failed</text><text class="ts" x="548" y="154" text-anchor="middle" dominant-baseline="central">use the cache</text></g>
<line x1="10" y1="188" x2="656" y2="188" class="leader"/>
<text class="th" x="10" y="226" dominant-baseline="central">Stale-while-revalidate</text><text class="ts" x="10" y="244" dominant-baseline="central">e.g. news article</text>
<g class="c-teal"><rect x="190" y="210" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="256" y="226" text-anchor="middle" dominant-baseline="central">1  Return cache</text><text class="ts" x="256" y="244" text-anchor="middle" dominant-baseline="central">instant, maybe old</text></g>
<line x1="324" y1="234" x2="334" y2="234" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-gray"><rect x="336" y="210" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="402" y="226" text-anchor="middle" dominant-baseline="central">2  Fetch</text><text class="ts" x="402" y="244" text-anchor="middle" dominant-baseline="central">in the background</text></g>
<line x1="470" y1="234" x2="480" y2="234" stroke="var(--b)" stroke-width="1.5" marker-end="url(#ah7-service-worker-cache-strategies)"/>
<g class="c-teal"><rect x="482" y="210" width="132" height="48" rx="6" stroke-width="0.5"/><text class="th" x="548" y="226" text-anchor="middle" dominant-baseline="central">3  Update cache</text><text class="ts" x="548" y="244" text-anchor="middle" dominant-baseline="central">next visit is fresh</text></g>
<text class="ts" x="10" y="292">Teal: answered from the cache. Gray: answered from the network.</text></svg>
