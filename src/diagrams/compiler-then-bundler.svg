<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"><title>The compiler works per file; the bundler works on the whole graph</title><desc>Source files App.tsx, Home.tsx and utils.ts go into a compiler one file in and one file out, producing App.js, Home.js and utils.js. A bundler takes many modules in and produces a few chunks out, index and lazy files with content hashes in their names. The compiler works per file and can run in parallel. The bundler needs the whole module graph.</desc><defs><marker id="arrow-compiler-then-bundler" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="16" y="56" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="66" y="73" text-anchor="middle" dominant-baseline="central">App.tsx</text></g>
<g class="c-gray"><rect x="16" y="98" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="66" y="115" text-anchor="middle" dominant-baseline="central">Home.tsx</text></g>
<g class="c-gray"><rect x="16" y="140" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="66" y="157" text-anchor="middle" dominant-baseline="central">utils.ts</text></g>
<g class="c-purple"><rect x="146" y="56" width="110" height="118" rx="8" stroke-width="0.5"/><text class="th" x="201" y="97" text-anchor="middle" dominant-baseline="central">Compiler</text><text class="ts" x="201" y="115" text-anchor="middle" dominant-baseline="central">one file in</text><text class="ts" x="201" y="133" text-anchor="middle" dominant-baseline="central">one file out</text></g>
<g class="c-gray"><rect x="286" y="56" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="336" y="73" text-anchor="middle" dominant-baseline="central">App.js</text></g>
<g class="c-gray"><rect x="286" y="98" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="336" y="115" text-anchor="middle" dominant-baseline="central">Home.js</text></g>
<g class="c-gray"><rect x="286" y="140" width="100" height="34" rx="8" stroke-width="0.5"/><text class="th" x="336" y="157" text-anchor="middle" dominant-baseline="central">utils.js</text></g>
<g class="c-purple"><rect x="416" y="56" width="110" height="118" rx="8" stroke-width="0.5"/><text class="th" x="471" y="97" text-anchor="middle" dominant-baseline="central">Bundler</text><text class="ts" x="471" y="115" text-anchor="middle" dominant-baseline="central">many modules in</text><text class="ts" x="471" y="133" text-anchor="middle" dominant-baseline="central">few chunks out</text></g>
<g class="c-teal"><rect x="556" y="72" width="108" height="40" rx="8" stroke-width="0.5"/><text class="th" x="610" y="92" text-anchor="middle" dominant-baseline="central">index-hash.js</text></g>
<g class="c-teal"><rect x="556" y="120" width="108" height="40" rx="8" stroke-width="0.5"/><text class="th" x="610" y="140" text-anchor="middle" dominant-baseline="central">lazy-hash.js</text></g>
