<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img"><title>Files go to a static host; code that runs per request needs a runtime</title><desc>CSR and SSG output is static files in dist or out, which go to a static host or CDN; a single-page app needs a fallback rule there. SSR output is server code plus static files, which needs a runtime: a Node server, a container, serverless or an edge runtime.</desc><defs><marker id="arrow-where-each-output-is-deployed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="20" y="24" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="43" text-anchor="middle" dominant-baseline="central">CSR / SSG output</text><text class="ts" x="150" y="61" text-anchor="middle" dominant-baseline="central">dist/ or out/: static files</text></g>
<g class="c-gray"><rect x="340" y="24" width="320" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="43" text-anchor="middle" dominant-baseline="central">Static host or CDN</text><text class="ts" x="500" y="61" text-anchor="middle" dominant-baseline="central">an SPA needs a fallback rule</text></g>
<g class="c-gray"><rect x="20" y="108" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="150" y="127" text-anchor="middle" dominant-baseline="central">SSR output</text><text class="ts" x="150" y="145" text-anchor="middle" dominant-baseline="central">server code plus static files</text></g>
<g class="c-purple"><rect x="340" y="108" width="320" height="56" rx="8" stroke-width="0.5"/><text class="th" x="500" y="127" text-anchor="middle" dominant-baseline="central">A runtime</text><text class="ts" x="500" y="145" text-anchor="middle" dominant-baseline="central">Node server, container, serverless or edge</text></g>
<line x1="282" y1="52" x2="338" y2="52" class="arr" marker-end="url(#arrow-where-each-output-is-deployed)"/>
<line x1="282" y1="136" x2="338" y2="136" class="arr" marker-end="url(#arrow-where-each-output-is-deployed)"/></svg>