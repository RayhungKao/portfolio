<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" role="img"><title>Three kinds of storage behind a backend</title><desc>The backend uses three different stores: a database for structured data you query, a cache for temporary data that can be recomputed, and object storage for large files.</desc><defs><marker id="arrow-three-kinds-of-storage" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="40" y="108" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="115" y="128" text-anchor="middle" dominant-baseline="central">Backend</text><text class="ts" x="115" y="146" text-anchor="middle" dominant-baseline="central">Picks the store</text></g>
<g class="c-teal"><rect x="300" y="40" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="60" text-anchor="middle" dominant-baseline="central">Database</text><text class="ts" x="470" y="78" text-anchor="middle" dominant-baseline="central">Orders, users, stock. PostgreSQL</text></g>
<g class="c-teal"><rect x="300" y="108" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="128" text-anchor="middle" dominant-baseline="central">Cache</text><text class="ts" x="470" y="146" text-anchor="middle" dominant-baseline="central">Sessions, hot lists. Redis</text></g>
<g class="c-teal"><rect x="300" y="176" width="340" height="56" rx="8" stroke-width="0.5"/><text class="th" x="470" y="196" text-anchor="middle" dominant-baseline="central">Object storage</text><text class="ts" x="470" y="214" text-anchor="middle" dominant-baseline="central">Photos, videos. S3</text></g>
<line x1="194" y1="128" x2="296" y2="72" class="arr" marker-end="url(#arrow-three-kinds-of-storage)"/>
<line x1="194" y1="136" x2="296" y2="136" class="arr" marker-end="url(#arrow-three-kinds-of-storage)"/>
<line x1="194" y1="144" x2="296" y2="204" class="arr" marker-end="url(#arrow-three-kinds-of-storage)"/>
<text class="ts" x="40" y="260">Teal: data you keep. Each store fits a different shape and access pattern.</text></svg>
