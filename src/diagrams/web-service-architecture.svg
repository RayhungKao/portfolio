<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>Anatomy of a web service</title><desc>The client reaches the backend through an edge layer. The backend reads and writes data stores, calls third-party services such as Stripe directly, and puts background jobs on a queue. A worker takes jobs from the queue, writes to the data stores and calls third-party services such as email.</desc><defs><marker id="arrow-web-service-architecture" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="50" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="70" text-anchor="middle" dominant-baseline="central">Client</text><text class="ts" x="107" y="88" text-anchor="middle" dominant-baseline="central">Browser or app</text></g>
<g class="c-gray"><rect x="195" y="50" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="70" text-anchor="middle" dominant-baseline="central">Edge</text><text class="ts" x="262" y="88" text-anchor="middle" dominant-baseline="central">CDN and proxy</text></g>
<g class="c-purple"><rect x="350" y="50" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="70" text-anchor="middle" dominant-baseline="central">Backend</text><text class="ts" x="417" y="88" text-anchor="middle" dominant-baseline="central">Code and secrets</text></g>
<g class="c-teal"><rect x="505" y="50" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="572" y="70" text-anchor="middle" dominant-baseline="central">Data stores</text><text class="ts" x="572" y="88" text-anchor="middle" dominant-baseline="central">DB, cache, files</text></g>
<g class="c-gray"><rect x="195" y="190" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="210" text-anchor="middle" dominant-baseline="central">Third-party</text><text class="ts" x="262" y="228" text-anchor="middle" dominant-baseline="central">Stripe, email</text></g>
<g class="c-purple"><rect x="350" y="190" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="210" text-anchor="middle" dominant-baseline="central">Queue + worker</text><text class="ts" x="417" y="228" text-anchor="middle" dominant-baseline="central">Background jobs</text></g>
<line x1="179" y1="78" x2="191" y2="78" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<line x1="334" y1="78" x2="346" y2="78" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<line x1="489" y1="78" x2="501" y2="78" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<line x1="440" y1="110" x2="440" y2="186" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<path d="M375 110 L375 150 L262 150 L262 186" fill="none" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<path d="M489 218 L572 218 L572 110" fill="none" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<line x1="346" y1="218" x2="334" y2="218" class="arr" marker-end="url(#arrow-web-service-architecture)"/>
<text class="ts" x="40" y="276">Purple: runs on your side. Teal: data you keep. Gray: outside your own code.</text>
<text class="ts" x="40" y="294">The backend calls Stripe directly, using the secret key.</text>
<text class="ts" x="40" y="312">The worker sends emails after the request has already returned.</text></svg>
