<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 345" role="img"><title>Three common application shapes and their two axes</title><desc>Shape A: the browser talks to one Next.js app that holds the pages and the API; the HTML comes from Next.js and the backend is together. Shape B: the browser talks to Next.js, which calls a separate backend; the HTML comes from Next.js and the backend is separate. Shape C: a static frontend on a CDN sends files to the browser, which calls a separate API server; the HTML comes from the browser and the backend is separate.</desc><defs><marker id="arrow-three-application-shapes" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="30">A. Next.js does everything</text>
<text class="ts" x="640" y="30" text-anchor="end">HTML from Next.js · backend together</text>
<g class="c-gray"><rect x="40" y="44" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="64" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="107" y="82" text-anchor="middle" dominant-baseline="central">User's device</text></g>
<g class="c-purple"><rect x="195" y="44" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="64" text-anchor="middle" dominant-baseline="central">Next.js</text><text class="ts" x="262" y="82" text-anchor="middle" dominant-baseline="central">UI and API in one</text></g>
<g class="c-teal"><rect x="350" y="44" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="64" text-anchor="middle" dominant-baseline="central">Database</text><text class="ts" x="417" y="82" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g>
<line x1="179" y1="72" x2="191" y2="72" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<line x1="334" y1="72" x2="346" y2="72" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<text class="th" x="40" y="130">B. Next.js plus a separate backend</text>
<text class="ts" x="640" y="130" text-anchor="end">HTML from Next.js · backend separate</text>
<g class="c-gray"><rect x="40" y="144" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="164" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="107" y="182" text-anchor="middle" dominant-baseline="central">User's device</text></g>
<g class="c-purple"><rect x="195" y="144" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="164" text-anchor="middle" dominant-baseline="central">Next.js</text><text class="ts" x="262" y="182" text-anchor="middle" dominant-baseline="central">Pages and a BFF</text></g>
<g class="c-purple"><rect x="350" y="144" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="164" text-anchor="middle" dominant-baseline="central">Backend</text><text class="ts" x="417" y="182" text-anchor="middle" dominant-baseline="central">Shared API service</text></g>
<g class="c-teal"><rect x="505" y="144" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="572" y="164" text-anchor="middle" dominant-baseline="central">Database</text><text class="ts" x="572" y="182" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g>
<line x1="179" y1="172" x2="191" y2="172" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<line x1="334" y1="172" x2="346" y2="172" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<line x1="489" y1="172" x2="501" y2="172" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<text class="th" x="40" y="230">C. Front-back separated</text>
<text class="ts" x="640" y="230" text-anchor="end">HTML from the browser · backend separate</text>
<g class="c-gray"><rect x="40" y="244" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="264" text-anchor="middle" dominant-baseline="central">Static frontend</text><text class="ts" x="107" y="282" text-anchor="middle" dominant-baseline="central">React on a CDN</text></g>
<g class="c-gray"><rect x="195" y="244" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="264" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="262" y="282" text-anchor="middle" dominant-baseline="central">Runs the app</text></g>
<g class="c-purple"><rect x="350" y="244" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="264" text-anchor="middle" dominant-baseline="central">API server</text><text class="ts" x="417" y="282" text-anchor="middle" dominant-baseline="central">Any language</text></g>
<g class="c-teal"><rect x="505" y="244" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="572" y="264" text-anchor="middle" dominant-baseline="central">Database</text><text class="ts" x="572" y="282" text-anchor="middle" dominant-baseline="central">PostgreSQL</text></g>
<line x1="179" y1="272" x2="191" y2="272" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<line x1="334" y1="272" x2="346" y2="272" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<line x1="489" y1="272" x2="501" y2="272" class="arr" marker-end="url(#arrow-three-application-shapes)"/>
<text class="ts" x="40" y="328">Two axes: where the HTML comes from, and whether the backend is separate.</text></svg>
