<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>Four tables of an online store and how they relate</title><desc>Four tables: users, orders, order_items and products. One user has many orders. One order has many order_items. One product appears in many order_items. Each order points to its user with a foreign key user_id, and each order item points to its order and to its product with foreign keys order_id and product_id.</desc><defs><marker id="arrow-ecommerce-erd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-teal"><rect x="30" y="20" width="170" height="106" rx="8" stroke-width="0.5"/><text class="th" x="115.0" y="37" text-anchor="middle" dominant-baseline="central">users</text></g><line x1="30" y1="54" x2="200" y2="54" class="leader"/><text class="ts" x="42" y="68" dominant-baseline="central">id</text><text class="ts" x="188" y="68" text-anchor="end" dominant-baseline="central" font-weight="500">PK</text><text class="ts" x="42" y="90" dominant-baseline="central">email</text><text class="ts" x="42" y="112" dominant-baseline="central">name</text>
<g class="c-teal"><rect x="255" y="20" width="170" height="128" rx="8" stroke-width="0.5"/><text class="th" x="340.0" y="37" text-anchor="middle" dominant-baseline="central">orders</text></g><line x1="255" y1="54" x2="425" y2="54" class="leader"/><text class="ts" x="267" y="68" dominant-baseline="central">id</text><text class="ts" x="413" y="68" text-anchor="end" dominant-baseline="central" font-weight="500">PK</text><text class="ts" x="267" y="90" dominant-baseline="central">user_id</text><text class="ts" x="413" y="90" text-anchor="end" dominant-baseline="central" font-weight="500">FK</text><text class="ts" x="267" y="112" dominant-baseline="central">status</text><text class="ts" x="267" y="134" dominant-baseline="central">created_at</text>
<g class="c-teal"><rect x="480" y="20" width="170" height="128" rx="8" stroke-width="0.5"/><text class="th" x="565.0" y="37" text-anchor="middle" dominant-baseline="central">order_items</text></g><line x1="480" y1="54" x2="650" y2="54" class="leader"/><text class="ts" x="492" y="68" dominant-baseline="central">id</text><text class="ts" x="638" y="68" text-anchor="end" dominant-baseline="central" font-weight="500">PK</text><text class="ts" x="492" y="90" dominant-baseline="central">order_id</text><text class="ts" x="638" y="90" text-anchor="end" dominant-baseline="central" font-weight="500">FK</text><text class="ts" x="492" y="112" dominant-baseline="central">product_id</text><text class="ts" x="638" y="112" text-anchor="end" dominant-baseline="central" font-weight="500">FK</text><text class="ts" x="492" y="134" dominant-baseline="central">quantity</text>
<g class="c-teal"><rect x="480" y="190" width="170" height="128" rx="8" stroke-width="0.5"/><text class="th" x="565.0" y="207" text-anchor="middle" dominant-baseline="central">products</text></g><line x1="480" y1="224" x2="650" y2="224" class="leader"/><text class="ts" x="492" y="238" dominant-baseline="central">id</text><text class="ts" x="638" y="238" text-anchor="end" dominant-baseline="central" font-weight="500">PK</text><text class="ts" x="492" y="260" dominant-baseline="central">name</text><text class="ts" x="492" y="282" dominant-baseline="central">price</text><text class="ts" x="492" y="304" dominant-baseline="central">stock</text>
<line x1="200" y1="76" x2="255" y2="76" class="arr"/><text class="ts" x="206" y="66">1</text><text class="ts" x="242" y="66">n</text>
<line x1="425" y1="76" x2="480" y2="76" class="arr"/><text class="ts" x="431" y="66">1</text><text class="ts" x="467" y="66">n</text>
<line x1="565" y1="190" x2="565" y2="148" class="arr"/><text class="ts" x="573" y="180">1</text><text class="ts" x="573" y="164">n</text>
<text class="ts" x="30" y="200">PK: primary key, a unique id for the row.</text>
<text class="ts" x="30" y="222">FK: foreign key, the id of a row in another table.</text>
<text class="ts" x="30" y="244">1 to n: one row on the left side can match many on the right.</text>
<text class="ts" x="30" y="274">order_items is the join table: it turns "orders have many</text>
<text class="ts" x="30" y="294">products, products are in many orders" into two 1-to-n links.</text>
</svg>