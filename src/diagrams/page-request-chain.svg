<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>One page view is a chain of requests</title><desc>A browser and a server exchange four messages. The browser asks for a page and gets HTML back, then asks for the CSS, JavaScript and images that the HTML points to and gets those files back. Only then does the browser render the page.</desc><defs><marker id="arrow-page-request-chain" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="40" y="10" width="140" height="48" rx="8" stroke-width="0.5"/><text class="th" x="110" y="25" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="110" y="43" text-anchor="middle" dominant-baseline="central">User's device</text></g>
<g class="c-purple"><rect x="500" y="10" width="140" height="48" rx="8" stroke-width="0.5"/><text class="th" x="570" y="25" text-anchor="middle" dominant-baseline="central">Server</text><text class="ts" x="570" y="43" text-anchor="middle" dominant-baseline="central">Your machine or a host</text></g>
<line x1="110" y1="62" x2="110" y2="262" class="leader"/>
<line x1="570" y1="62" x2="570" y2="262" class="leader"/>
<line x1="114" y1="100" x2="566" y2="100" class="arr" marker-end="url(#arrow-page-request-chain)"/>
<text class="ts" x="340" y="92" text-anchor="middle">1 · request: GET /blog</text>
<line x1="566" y1="140" x2="114" y2="140" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-page-request-chain)"/>
<text class="ts" x="340" y="132" text-anchor="middle">2 · response: HTML</text>
<line x1="114" y1="190" x2="566" y2="190" class="arr" marker-end="url(#arrow-page-request-chain)"/>
<text class="ts" x="340" y="182" text-anchor="middle">3 · requests: CSS, JS, images</text>
<line x1="566" y1="230" x2="114" y2="230" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-page-request-chain)"/>
<text class="ts" x="340" y="222" text-anchor="middle">4 · responses: the files</text>
<g class="c-gray"><rect x="40" y="276" width="270" height="40" rx="8" stroke-width="0.5"/><text class="th" x="175" y="296" text-anchor="middle" dominant-baseline="central">5 · Browser renders the page</text></g></svg>