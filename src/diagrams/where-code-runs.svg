<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"><title>Every technical choice puts code in one of three spots</title><desc>Three columns from left to right: build time, server and browser. Build time runs once before release on your machine or CI and can compile and generate HTML but cannot know who visits. The server runs on every request and can query a database and hold secrets but cannot react to a click on its own. The browser runs while the page is open and can react to clicks and use canvas but cannot hold secrets.</desc><defs><marker id="arrow-where-code-runs" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="20" y="40" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="120" y="73" text-anchor="middle" dominant-baseline="central">Build time</text><text class="ts" x="120" y="91" text-anchor="middle" dominant-baseline="central">Once, before release</text><text class="ts" x="120" y="109" text-anchor="middle" dominant-baseline="central">Can: compile, generate HTML</text><text class="ts" x="120" y="127" text-anchor="middle" dominant-baseline="central">Cannot: know who visits</text></g>
<g class="c-purple"><rect x="244" y="40" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="344" y="73" text-anchor="middle" dominant-baseline="central">Server</text><text class="ts" x="344" y="91" text-anchor="middle" dominant-baseline="central">On every request</text><text class="ts" x="344" y="109" text-anchor="middle" dominant-baseline="central">Can: query a DB, hold secrets</text><text class="ts" x="344" y="127" text-anchor="middle" dominant-baseline="central">Cannot: react to a click alone</text></g>
<g class="c-gray"><rect x="468" y="40" width="200" height="120" rx="8" stroke-width="0.5"/><text class="th" x="568" y="73" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="568" y="91" text-anchor="middle" dominant-baseline="central">While the page is open</text><text class="ts" x="568" y="109" text-anchor="middle" dominant-baseline="central">Can: react to clicks, draw canvas</text><text class="ts" x="568" y="127" text-anchor="middle" dominant-baseline="central">Cannot: hold secrets</text></g>
<line x1="222" y1="100" x2="242" y2="100" class="arr" marker-end="url(#arrow-where-code-runs)"/>
<line x1="446" y1="100" x2="466" y2="100" class="arr" marker-end="url(#arrow-where-code-runs)"/>
<text class="ts" x="20" y="24">Time and place, left to right: first a point in time, then two places.</text>
<text class="ts" x="340" y="200" text-anchor="middle">The same JavaScript can run in more than one spot.</text>
<text class="ts" x="340" y="222" text-anchor="middle">Purple: code you run. Gray: a device you do not control.</text></svg>