<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" role="img"><title>Resource limits along the request path</title><desc>A request passes the network link, the kernel network stack, Nginx, and the app. The first two limits are hit before Nginx can act.</desc>
<defs><marker id="arrow-request-path-resource-limits" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-coral"><rect x="30" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="97" y="58" text-anchor="middle" dominant-baseline="central">Network link</text><text class="ts" x="97" y="78" text-anchor="middle" dominant-baseline="central">Bandwidth limit</text></g>
<g class="c-coral"><rect x="195" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="58" text-anchor="middle" dominant-baseline="central">Kernel</text><text class="ts" x="262" y="78" text-anchor="middle" dominant-baseline="central">Connection limits</text></g>
<g class="c-purple"><rect x="360" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="427" y="58" text-anchor="middle" dominant-baseline="central">Nginx</text><text class="ts" x="427" y="78" text-anchor="middle" dominant-baseline="central">CPU, connections</text></g>
<g class="c-purple"><rect x="525" y="40" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="592" y="58" text-anchor="middle" dominant-baseline="central">App</text><text class="ts" x="592" y="78" text-anchor="middle" dominant-baseline="central">Your code</text></g>
<line x1="165" y1="68" x2="193" y2="68" class="arr" marker-end="url(#arrow-request-path-resource-limits)"/>
<line x1="330" y1="68" x2="358" y2="68" class="arr" marker-end="url(#arrow-request-path-resource-limits)"/>
<line x1="495" y1="68" x2="523" y2="68" class="arr" marker-end="url(#arrow-request-path-resource-limits)"/>
<rect x="30" y="140" width="14" height="14" rx="3" class="c-coral" stroke-width="0.5"/><text class="ts" x="52" y="147" dominant-baseline="central">Limits hit before Nginx can act</text>
<rect x="320" y="140" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><text class="ts" x="342" y="147" dominant-baseline="central">Where Nginx and your code can act</text>
</svg>
