<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img"><title>Five states of an action made while offline</title><desc>An action starts as Queued, then moves to Sending. From Sending it can go back and forth to Retrying when the result is unknown, move to Synced when the server confirms, or move to Rejected when the server clearly refuses.</desc><defs><marker id="arrow-offline-action-five-states" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="195" y="16" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="36" text-anchor="middle" dominant-baseline="central">Retrying</text><text class="ts" x="262" y="54" text-anchor="middle" dominant-baseline="central">Still shows a clock</text></g>
<g class="c-gray"><rect x="40" y="106" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="126" text-anchor="middle" dominant-baseline="central">Queued</text><text class="ts" x="107" y="144" text-anchor="middle" dominant-baseline="central">Pending mark</text></g>
<g class="c-gray"><rect x="195" y="106" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="126" text-anchor="middle" dominant-baseline="central">Sending</text><text class="ts" x="262" y="144" text-anchor="middle" dominant-baseline="central">Clock or spinner</text></g>
<g class="c-teal"><rect x="350" y="106" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="126" text-anchor="middle" dominant-baseline="central">Synced</text><text class="ts" x="417" y="144" text-anchor="middle" dominant-baseline="central">Server confirmed</text></g>
<g class="c-coral"><rect x="350" y="196" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="216" text-anchor="middle" dominant-baseline="central">Rejected</text><text class="ts" x="417" y="234" text-anchor="middle" dominant-baseline="central">Error and choices</text></g>
<line x1="179" y1="134" x2="191" y2="134" class="arr" marker-end="url(#arrow-offline-action-five-states)"/>
<line x1="334" y1="134" x2="346" y2="134" class="arr" marker-end="url(#arrow-offline-action-five-states)"/>
<line x1="235" y1="102" x2="235" y2="76" class="arr" marker-end="url(#arrow-offline-action-five-states)"/>
<line x1="290" y1="76" x2="290" y2="102" class="arr" marker-end="url(#arrow-offline-action-five-states)"/>
<path d="M262 166 L262 224 L346 224" fill="none" class="arr" stroke="#D85A30" marker-end="url(#arrow-offline-action-five-states)"/>
<text class="ts" x="346" y="46" dominant-baseline="central">Unknown result: retry with the same key</text>
<text class="ts" x="505" y="126" dominant-baseline="central">2xx, or a confirmed</text><text class="ts" x="505" y="144" dominant-baseline="central">404 on delete</text>
<text class="ts" x="505" y="216" dominant-baseline="central">400, 403, 409, 422:</text><text class="ts" x="505" y="234" dominant-baseline="central">retrying cannot help</text>
<text class="ts" x="40" y="280">Examples: Gmail Outbox (Queued), WhatsApp clock (Sending), WhatsApp tick (Synced).</text></svg>
