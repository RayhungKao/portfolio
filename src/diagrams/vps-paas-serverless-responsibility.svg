<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>Who manages what on a VPS, a PaaS, and a serverless platform</title><desc>A grid comparing a VPS, a PaaS, and serverless across your code, runtime and packaging, operating system and restarts, and machines and scaling. Vendor-handled cells are gray and cells you handle are purple.</desc>
<text class="th" x="245" y="22" text-anchor="middle">VPS</text>
<text class="th" x="415" y="22" text-anchor="middle">PaaS</text>
<text class="th" x="585" y="22" text-anchor="middle">Serverless</text>
<g><rect class="box" x="20" y="40" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="85" y="66" text-anchor="middle" dominant-baseline="central">Your code</text></g>
<g><rect class="box" x="20" y="104" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="85" y="130" text-anchor="middle" dominant-baseline="central">Runtime</text></g>
<g><rect class="box" x="20" y="168" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="85" y="194" text-anchor="middle" dominant-baseline="central">OS, TLS, restart</text></g>
<g><rect class="box" x="20" y="232" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="85" y="258" text-anchor="middle" dominant-baseline="central">Machines</text></g>
<g class="c-purple"><rect x="170" y="40" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="245" y="58" text-anchor="middle" dominant-baseline="central">You write it</text><text class="ts" x="245" y="78" text-anchor="middle" dominant-baseline="central">Any language</text></g>
<g class="c-purple"><rect x="340" y="40" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="415" y="58" text-anchor="middle" dominant-baseline="central">You write it</text><text class="ts" x="415" y="78" text-anchor="middle" dominant-baseline="central">Git push or image</text></g>
<g class="c-purple"><rect x="510" y="40" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="58" text-anchor="middle" dominant-baseline="central">You write it</text><text class="ts" x="585" y="78" text-anchor="middle" dominant-baseline="central">One function each</text></g>
<g class="c-purple"><rect x="170" y="104" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="245" y="122" text-anchor="middle" dominant-baseline="central">You install it</text><text class="ts" x="245" y="142" text-anchor="middle" dominant-baseline="central">Node, Docker, Nginx</text></g>
<g class="c-gray"><rect x="340" y="104" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="415" y="122" text-anchor="middle" dominant-baseline="central">Platform builds</text><text class="ts" x="415" y="142" text-anchor="middle" dominant-baseline="central">Buildpack or Docker</text></g>
<g class="c-gray"><rect x="510" y="104" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="122" text-anchor="middle" dominant-baseline="central">Platform runs it</text><text class="ts" x="585" y="142" text-anchor="middle" dominant-baseline="central">Pick a runtime</text></g>
<g class="c-purple"><rect x="170" y="168" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="245" y="186" text-anchor="middle" dominant-baseline="central">You set it up</text><text class="ts" x="245" y="206" text-anchor="middle" dominant-baseline="central">Patches and certs</text></g>
<g class="c-gray"><rect x="340" y="168" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="415" y="186" text-anchor="middle" dominant-baseline="central">Built in</text><text class="ts" x="415" y="206" text-anchor="middle" dominant-baseline="central">HTTPS, auto restart</text></g>
<g class="c-gray"><rect x="510" y="168" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="186" text-anchor="middle" dominant-baseline="central">Built in</text><text class="ts" x="585" y="206" text-anchor="middle" dominant-baseline="central">Nothing to manage</text></g>
<g class="c-purple"><rect x="170" y="232" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="245" y="250" text-anchor="middle" dominant-baseline="central">You add machines</text><text class="ts" x="245" y="270" text-anchor="middle" dominant-baseline="central">Resize or clone</text></g>
<g class="c-gray"><rect x="340" y="232" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="415" y="250" text-anchor="middle" dominant-baseline="central">Platform runs</text><text class="ts" x="415" y="270" text-anchor="middle" dominant-baseline="central">You pick size, count</text></g>
<g class="c-gray"><rect x="510" y="232" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="250" text-anchor="middle" dominant-baseline="central">Automatic</text><text class="ts" x="585" y="270" text-anchor="middle" dominant-baseline="central">Per request</text></g>
<rect x="170" y="306" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><text class="ts" x="192" y="313" dominant-baseline="central">Vendor handles it</text>
<rect x="340" y="306" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><text class="ts" x="362" y="313" dominant-baseline="central">You handle it</text>
</svg>
