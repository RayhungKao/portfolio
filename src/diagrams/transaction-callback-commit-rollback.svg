<svg data-narrow xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 310" role="img"><title>How a transaction wraps your callback</title><desc>The transaction function opens a transaction, runs your callback, then commits if it returned normally or rolls back if it threw an error.</desc>
<defs><marker id="arrow-transaction-callback-commit-rollback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="90" y="20" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="190" y="36" text-anchor="middle" dominant-baseline="central">$transaction(fn)</text><text class="ts" x="190" y="54" text-anchor="middle" dominant-baseline="central">You pass in a function</text></g>
<g class="c-purple"><rect x="90" y="88" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="190" y="104" text-anchor="middle" dominant-baseline="central">BEGIN</text><text class="ts" x="190" y="122" text-anchor="middle" dominant-baseline="central">Transaction opens</text></g>
<g class="c-purple"><rect x="90" y="156" width="200" height="48" rx="8" stroke-width="0.5"/><text class="th" x="190" y="172" text-anchor="middle" dominant-baseline="central">Run your callback</text><text class="ts" x="190" y="190" text-anchor="middle" dominant-baseline="central">fn(tx) executes</text></g>
<g class="c-teal"><rect x="30" y="242" width="150" height="48" rx="8" stroke-width="0.5"/><text class="th" x="105" y="258" text-anchor="middle" dominant-baseline="central">COMMIT</text><text class="ts" x="105" y="276" text-anchor="middle" dominant-baseline="central">Returned normally</text></g>
<g class="c-coral"><rect x="200" y="242" width="150" height="48" rx="8" stroke-width="0.5"/><text class="th" x="275" y="258" text-anchor="middle" dominant-baseline="central">ROLLBACK</text><text class="ts" x="275" y="276" text-anchor="middle" dominant-baseline="central">Threw an error</text></g>
<line x1="190" y1="70" x2="190" y2="86" class="arr" marker-end="url(#arrow-transaction-callback-commit-rollback)"/>
<line x1="190" y1="138" x2="190" y2="154" class="arr" marker-end="url(#arrow-transaction-callback-commit-rollback)"/>
<line x1="160" y1="206" x2="115" y2="240" class="arr" marker-end="url(#arrow-transaction-callback-commit-rollback)"/>
<line x1="220" y1="206" x2="265" y2="240" class="arr" marker-end="url(#arrow-transaction-callback-commit-rollback)"/>
</svg>
