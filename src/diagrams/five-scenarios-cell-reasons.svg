<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 950" role="img"><title>Five real scenarios, with the reason for every choice</title><desc>Five blocks, one per scenario. Each block lists six capabilities: auth, database, logic, jobs, realtime and hosting. Each line shows the chosen service as a coloured chip and one sentence saying why. The scenarios are a portfolio with a contact form, a 20-person leave system, a subscription SaaS, a delivery platform, and a mobile chat MVP.</desc>
<text class="th" x="10" y="18" dominant-baseline="central">1  Portfolio with contact form</text>
<text class="ts" x="10" y="42" dominant-baseline="central">Auth</text><rect x="90" y="32" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="42" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="42" dominant-baseline="central">Visitors do not log in.</text>
<text class="ts" x="10" y="66" dominant-baseline="central">Database</text><rect x="90" y="56" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="66" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="66" dominant-baseline="central">Nothing to store; the email is sent, not saved.</text>
<text class="ts" x="10" y="90" dominant-baseline="central">Logic</text><g class="c-purple"><rect x="90" y="80" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="90" text-anchor="middle" dominant-baseline="central">1 function: send email</text></g><text class="ts" x="262" y="90" dominant-baseline="central">Only the email API key must stay secret.</text>
<text class="ts" x="10" y="114" dominant-baseline="central">Jobs</text><rect x="90" y="104" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="114" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="114" dominant-baseline="central">Sending one email is quick; no queue needed.</text>
<text class="ts" x="10" y="138" dominant-baseline="central">Realtime</text><rect x="90" y="128" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="138" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="138" dominant-baseline="central">Nothing needs to update live.</text>
<text class="ts" x="10" y="162" dominant-baseline="central">Hosting</text><g class="c-gray"><rect x="90" y="152" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="162" text-anchor="middle" dominant-baseline="central">Vercel or Cloudflare</text></g><text class="ts" x="262" y="162" dominant-baseline="central">Static files plus one function; no server to run.</text>
<line x1="10" y1="182" x2="656" y2="182" class="leader"/>
<text class="th" x="10" y="198" dominant-baseline="central">2  Leave system, 20 people</text>
<text class="ts" x="10" y="222" dominant-baseline="central">Auth</text><g class="c-gray"><rect x="90" y="212" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="222" text-anchor="middle" dominant-baseline="central">Supabase Auth</text></g><text class="ts" x="262" y="222" dominant-baseline="central">Ships with the database, so RLS can use the user id.</text>
<text class="ts" x="10" y="246" dominant-baseline="central">Database</text><g class="c-teal"><rect x="90" y="236" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="246" text-anchor="middle" dominant-baseline="central">PostgreSQL on Supabase</text></g><text class="ts" x="262" y="246" dominant-baseline="central">Rules fit RLS: own rows, own department.</text>
<text class="ts" x="10" y="270" dominant-baseline="central">Logic</text><g class="c-purple"><rect x="90" y="260" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="270" text-anchor="middle" dominant-baseline="central">1 Edge Function: Slack</text></g><text class="ts" x="262" y="270" dominant-baseline="central">Slack needs a secret key, so it cannot run in the browser.</text>
<text class="ts" x="10" y="294" dominant-baseline="central">Jobs</text><rect x="90" y="284" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="294" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="294" dominant-baseline="central">The Slack message goes out in the same request.</text>
<text class="ts" x="10" y="318" dominant-baseline="central">Realtime</text><rect x="90" y="308" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="318" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="318" dominant-baseline="central">Nobody needs live updates.</text>
<text class="ts" x="10" y="342" dominant-baseline="central">Hosting</text><g class="c-gray"><rect x="90" y="332" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="342" text-anchor="middle" dominant-baseline="central">Supabase + static host</text></g><text class="ts" x="262" y="342" dominant-baseline="central">No server to run; two weeks to launch.</text>
<line x1="10" y1="362" x2="656" y2="362" class="leader"/>
<text class="th" x="10" y="378" dominant-baseline="central">3  Subscription SaaS</text>
<text class="ts" x="10" y="402" dominant-baseline="central">Auth</text><g class="c-gray"><rect x="90" y="392" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="402" text-anchor="middle" dominant-baseline="central">Clerk</text></g><text class="ts" x="262" y="402" dominant-baseline="central">Hosted login; a 3-person team should not rebuild it.</text>
<text class="ts" x="10" y="426" dominant-baseline="central">Database</text><g class="c-teal"><rect x="90" y="416" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="426" text-anchor="middle" dominant-baseline="central">PostgreSQL on Neon</text></g><text class="ts" x="262" y="426" dominant-baseline="central">Billing data needs relations; Neon scales to zero.</text>
<text class="ts" x="10" y="450" dominant-baseline="central">Logic</text><g class="c-purple"><rect x="90" y="440" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="450" text-anchor="middle" dominant-baseline="central">Next.js route handlers</text></g><text class="ts" x="262" y="450" dominant-baseline="central">Webhooks are short, so they fit functions.</text>
<text class="ts" x="10" y="474" dominant-baseline="central">Jobs</text><g class="c-purple"><rect x="90" y="464" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="474" text-anchor="middle" dominant-baseline="central">Fly.io worker, Inngest</text></g><text class="ts" x="262" y="474" dominant-baseline="central">Reports exceed the function time limit.</text>
<text class="ts" x="10" y="498" dominant-baseline="central">Realtime</text><rect x="90" y="488" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="498" text-anchor="middle" dominant-baseline="central">None</text><text class="ts" x="262" y="498" dominant-baseline="central">Nothing needs to update live.</text>
<text class="ts" x="10" y="522" dominant-baseline="central">Hosting</text><g class="c-gray"><rect x="90" y="512" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="522" text-anchor="middle" dominant-baseline="central">Vercel</text></g><text class="ts" x="262" y="522" dominant-baseline="central">Deploys Next.js with no setup.</text>
<line x1="10" y1="542" x2="656" y2="542" class="leader"/>
<text class="th" x="10" y="558" dominant-baseline="central">4  Delivery and ride-hailing</text>
<text class="ts" x="10" y="582" dominant-baseline="central">Auth</text><g class="c-purple"><rect x="90" y="572" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="582" text-anchor="middle" dominant-baseline="central">Auth library</text></g><text class="ts" x="262" y="582" dominant-baseline="central">Three client types share one set of accounts you control.</text>
<text class="ts" x="10" y="606" dominant-baseline="central">Database</text><g class="c-teal"><rect x="90" y="596" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="606" text-anchor="middle" dominant-baseline="central">PostgreSQL + PostGIS</text></g><text class="ts" x="262" y="606" dominant-baseline="central">Orders are relational; PostGIS handles map queries.</text>
<text class="ts" x="10" y="630" dominant-baseline="central">Logic</text><g class="c-purple"><rect x="90" y="620" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="630" text-anchor="middle" dominant-baseline="central">Full server (NestJS, Go)</text></g><text class="ts" x="262" y="630" dominant-baseline="central">Many clients share complex dispatch and pricing rules.</text>
<text class="ts" x="10" y="654" dominant-baseline="central">Jobs</text><g class="c-purple"><rect x="90" y="644" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="654" text-anchor="middle" dominant-baseline="central">Queue + worker</text></g><text class="ts" x="262" y="654" dominant-baseline="central">Notifications must not slow down the request.</text>
<text class="ts" x="10" y="678" dominant-baseline="central">Realtime</text><g class="c-purple"><rect x="90" y="668" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="678" text-anchor="middle" dominant-baseline="central">Redis + WebSocket</text></g><text class="ts" x="262" y="678" dominant-baseline="central">Rider positions change every second.</text>
<text class="ts" x="10" y="702" dominant-baseline="central">Hosting</text><g class="c-gray"><rect x="90" y="692" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="702" text-anchor="middle" dominant-baseline="central">Containers + Cloudflare</text></g><text class="ts" x="262" y="702" dominant-baseline="central">Steady traffic suits always-on containers.</text>
<line x1="10" y1="722" x2="656" y2="722" class="leader"/>
<text class="th" x="10" y="738" dominant-baseline="central">5  Mobile chat MVP, 2 people</text>
<text class="ts" x="10" y="762" dominant-baseline="central">Auth</text><g class="c-gray"><rect x="90" y="752" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="762" text-anchor="middle" dominant-baseline="central">Firebase Auth</text></g><text class="ts" x="262" y="762" dominant-baseline="central">Same SDK as the database; fastest start on mobile.</text>
<text class="ts" x="10" y="786" dominant-baseline="central">Database</text><g class="c-teal"><rect x="90" y="776" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="786" text-anchor="middle" dominant-baseline="central">Firestore</text></g><text class="ts" x="262" y="786" dominant-baseline="central">Offline sync built in. Later: export to PostgreSQL.</text>
<text class="ts" x="10" y="810" dominant-baseline="central">Logic</text><rect x="90" y="800" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="810" text-anchor="middle" dominant-baseline="central">None at first</text><text class="ts" x="262" y="810" dominant-baseline="central">Security rules are enough. Later: Cloud Functions.</text>
<text class="ts" x="10" y="834" dominant-baseline="central">Jobs</text><rect x="90" y="824" width="160" height="20" rx="5" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="170" y="834" text-anchor="middle" dominant-baseline="central">None at first</text><text class="ts" x="262" y="834" dominant-baseline="central">No heavy work yet. Later: moderation and search.</text>
<text class="ts" x="10" y="858" dominant-baseline="central">Realtime</text><g class="c-gray"><rect x="90" y="848" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="858" text-anchor="middle" dominant-baseline="central">Firestore live + push</text></g><text class="ts" x="262" y="858" dominant-baseline="central">Live updates and push come from the same service.</text>
<text class="ts" x="10" y="882" dominant-baseline="central">Hosting</text><g class="c-gray"><rect x="90" y="872" width="160" height="20" rx="5" stroke-width="0.5"/><text class="ts" x="170" y="882" text-anchor="middle" dominant-baseline="central">Firebase</text></g><text class="ts" x="262" y="882" dominant-baseline="central">One vendor, one console, no servers.</text>
<text class="ts" x="10" y="920">Purple: you write or run it. Gray: a provider runs it. Teal: where your data lives. Dashed: not needed.</text>
<text class="ts" x="10" y="938">Swap Clerk for Better Auth (a library you run) and that chip turns purple.</text></svg>
