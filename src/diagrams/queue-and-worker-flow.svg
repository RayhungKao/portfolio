<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 290" role="img"><title>A queue lets the web request finish before the slow work starts</title><desc>A browser sends a request to the API. The API saves the order, adds a job to a queue and answers at once. A worker takes jobs from the queue and does the slow work, such as sending an email through an email service. A failed job goes back to the queue to retry later, and after the last retry it moves to a dead-letter queue for a person to look at.</desc><defs><marker id="arrow-queue-and-worker-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="16" y="40" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="66" y="59" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="66" y="77" text-anchor="middle" dominant-baseline="central">POST /orders</text></g>
<g class="c-purple"><rect x="146" y="40" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="221" y="50" text-anchor="middle" dominant-baseline="central">API</text><text class="ts" x="221" y="68" text-anchor="middle" dominant-baseline="central">saves, adds a job,</text><text class="ts" x="221" y="86" text-anchor="middle" dominant-baseline="central">answers at once</text></g>
<g class="c-teal"><rect x="326" y="40" width="130" height="56" rx="8" stroke-width="0.5"/><text class="th" x="391" y="59" text-anchor="middle" dominant-baseline="central">Queue</text><text class="ts" x="391" y="77" text-anchor="middle" dominant-baseline="central">jobs wait here</text></g>
<g class="c-purple"><rect x="486" y="40" width="100" height="56" rx="8" stroke-width="0.5"/><text class="th" x="536" y="59" text-anchor="middle" dominant-baseline="central">Worker</text><text class="ts" x="536" y="77" text-anchor="middle" dominant-baseline="central">one job at a time</text></g>
<g class="c-gray"><rect x="614" y="40" width="56" height="56" rx="8" stroke-width="0.5"/><text class="th" x="642" y="59" text-anchor="middle" dominant-baseline="central">Email</text><text class="ts" x="642" y="77" text-anchor="middle" dominant-baseline="central">service</text></g>
<line x1="118" y1="68" x2="144" y2="68" class="arr" marker-end="url(#arrow-queue-and-worker-flow)"/>
<line x1="298" y1="68" x2="324" y2="68" class="arr" marker-end="url(#arrow-queue-and-worker-flow)"/>
<line x1="458" y1="68" x2="484" y2="68" class="arr" marker-end="url(#arrow-queue-and-worker-flow)"/>
<line x1="588" y1="68" x2="612" y2="68" class="arr" marker-end="url(#arrow-queue-and-worker-flow)"/>
<text class="ts" x="221" y="118" text-anchor="middle">The user is not kept waiting</text>
<path d="M510 98 L510 140 L391 140 L391 98" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-queue-and-worker-flow)"/>
<text class="ts" x="450" y="160" text-anchor="middle">fails: back to the queue, retry later</text>
<g class="c-coral"><rect x="326" y="200" width="260" height="56" rx="8" stroke-width="0.5"/><text class="th" x="456" y="219" text-anchor="middle" dominant-baseline="central">Dead-letter queue</text><text class="ts" x="456" y="237" text-anchor="middle" dominant-baseline="central">after the last retry: a person looks</text></g>
<line x1="566" y1="98" x2="566" y2="198" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-queue-and-worker-flow)"/>
<text class="ts" x="20" y="276">Teal: where jobs are kept. Coral: jobs that kept failing.</text></svg>