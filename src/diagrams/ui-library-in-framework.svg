<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330" role="img"><title>A framework wraps a UI library and adds the rest of the site</title><desc>A large frame labelled framework contains a UI library box. The framework adds routing, rendering modes, data loading and build setup. The UI library handles components, state and rendering, for example React, Vue, Svelte or Solid. A list names frameworks and the library each one uses. Without a framework you combine a UI library, a build tool and your own routing.</desc><defs><marker id="arrow-ui-library-in-framework" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="20" y="20" width="640" height="220" rx="12" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="th" x="40" y="46">Framework</text>
<text class="ts" x="40" y="66">routing · rendering modes · data loading · build setup</text>
<g class="c-purple"><rect x="40" y="90" width="320" height="130" rx="8" stroke-width="0.5"/><text class="th" x="200" y="137" text-anchor="middle" dominant-baseline="central">UI library</text><text class="ts" x="200" y="155" text-anchor="middle" dominant-baseline="central">components · state · rendering</text><text class="ts" x="200" y="173" text-anchor="middle" dominant-baseline="central">React, Vue, Svelte, Solid</text></g>
<text class="ts" x="390" y="106">Frameworks and the library they use</text>
<text class="t" x="390" y="130">Next.js (React)</text>
<text class="t" x="390" y="150">Nuxt (Vue)</text>
<text class="t" x="390" y="170">SvelteKit (Svelte)</text>
<text class="t" x="390" y="190">Astro (several libraries)</text>
<text class="t" x="390" y="210">React Router framework mode</text>
<rect x="20" y="262" width="640" height="48" rx="8" fill="none" stroke="var(--b)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="340" y="291" text-anchor="middle">Without a framework: UI library + build tool + your own routing</text></svg>