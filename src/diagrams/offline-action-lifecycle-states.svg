<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 230" role="img"><title>Lifecycle of one queued user action</title><desc>An action is queued locally, then sent. It can end as synced, be rejected by the server, or fall into a retry loop when the outcome is unknown.</desc>
<defs><marker id="arrow-offline-action-lifecycle-states" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="40" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="95" y="58" text-anchor="middle" dominant-baseline="central">Queued</text><text class="ts" x="95" y="78" text-anchor="middle" dominant-baseline="central">Stored locally</text></g>
<g class="c-purple"><rect x="210" y="40" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="275" y="58" text-anchor="middle" dominant-baseline="central">Sending</text><text class="ts" x="275" y="78" text-anchor="middle" dominant-baseline="central">Request in flight</text></g>
<g class="c-teal"><rect x="520" y="40" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="58" text-anchor="middle" dominant-baseline="central">Synced</text><text class="ts" x="585" y="78" text-anchor="middle" dominant-baseline="central">Server confirmed</text></g>
<g class="c-gray"><rect x="210" y="150" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="275" y="168" text-anchor="middle" dominant-baseline="central">Retrying</text><text class="ts" x="275" y="188" text-anchor="middle" dominant-baseline="central">Unknown, same key</text></g>
<g class="c-coral"><rect x="520" y="150" width="130" height="52" rx="8" stroke-width="0.5"/><text class="th" x="585" y="168" text-anchor="middle" dominant-baseline="central">Rejected</text><text class="ts" x="585" y="188" text-anchor="middle" dominant-baseline="central">409 or 403</text></g>
<line x1="162" y1="66" x2="208" y2="66" class="arr" marker-end="url(#arrow-offline-action-lifecycle-states)"/>
<line x1="342" y1="66" x2="518" y2="66" class="arr" marker-end="url(#arrow-offline-action-lifecycle-states)"/>
<line x1="250" y1="94" x2="250" y2="148" class="arr" marker-end="url(#arrow-offline-action-lifecycle-states)"/>
<line x1="300" y1="148" x2="300" y2="94" class="arr" marker-end="url(#arrow-offline-action-lifecycle-states)"/>
<line x1="342" y1="88" x2="518" y2="156" class="arr" marker-end="url(#arrow-offline-action-lifecycle-states)"/>
</svg>
