<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" role="img"><title>Ports, a network and a volume on one machine</title><desc>The browser on your machine reaches the api container through a published port, localhost:3000. Inside the Compose network the api reaches the database by its service name, db:5432. The database keeps its files in a named volume, which outlives the container.</desc>
<defs><marker id="arrow-docker-ports-network-volume" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="10" y="10" width="660" height="262" rx="12" fill="none" stroke="var(--border-strong)" stroke-width="0.5"/>
<text class="ts" x="26" y="28" dominant-baseline="central">Your machine</text>
<rect x="212" y="44" width="438" height="146" rx="12" fill="none" stroke="var(--border-strong)" stroke-width="0.5" stroke-dasharray="4 4"/>
<text class="ts" x="228" y="62" dominant-baseline="central">Compose network</text>
<g class="c-gray"><rect x="20" y="100" width="124" height="56" rx="8" stroke-width="0.5"/><text class="th" x="82" y="118" text-anchor="middle" dominant-baseline="central">Browser, curl</text><text class="ts" x="82" y="138" text-anchor="middle" dominant-baseline="central">localhost:3000</text></g>
<g class="c-purple"><rect x="230" y="100" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="305" y="118" text-anchor="middle" dominant-baseline="central">api</text><text class="ts" x="305" y="138" text-anchor="middle" dominant-baseline="central">listens on 0.0.0.0:3000</text></g>
<g class="c-gray"><rect x="470" y="100" width="150" height="56" rx="8" stroke-width="0.5"/><text class="th" x="545" y="118" text-anchor="middle" dominant-baseline="central">db</text><text class="ts" x="545" y="138" text-anchor="middle" dominant-baseline="central">postgres:17 on 5432</text></g>
<g class="c-teal"><rect x="470" y="210" width="150" height="48" rx="8" stroke-width="0.5"/><text class="th" x="545" y="226" text-anchor="middle" dominant-baseline="central">Volume db-data</text><text class="ts" x="545" y="244" text-anchor="middle" dominant-baseline="central">survives docker rm</text></g>
<line x1="144" y1="128" x2="228" y2="128" class="arr" marker-end="url(#arrow-docker-ports-network-volume)"/>
<line x1="380" y1="128" x2="468" y2="128" class="arr" marker-end="url(#arrow-docker-ports-network-volume)"/>
<line x1="545" y1="156" x2="545" y2="208" class="arr" marker-end="url(#arrow-docker-ports-network-volume)"/>
<text class="ts" x="82" y="172" text-anchor="middle" dominant-baseline="central">via -p 3000:3000</text>
<text class="ts" x="424" y="112" text-anchor="middle" dominant-baseline="central">db:5432</text>
<text class="ts" x="305" y="172" text-anchor="middle" dominant-baseline="central">localhost here = api itself</text>
<rect x="20" y="286" width="14" height="14" rx="3" class="c-gray" stroke-width="0.5"/><text class="ts" x="42" y="293" dominant-baseline="central">Not your code</text>
<rect x="160" y="286" width="14" height="14" rx="3" class="c-purple" stroke-width="0.5"/><text class="ts" x="182" y="293" dominant-baseline="central">Your code</text>
<rect x="280" y="286" width="14" height="14" rx="3" class="c-teal" stroke-width="0.5"/><text class="ts" x="302" y="293" dominant-baseline="central">Your data</text>
</svg>
