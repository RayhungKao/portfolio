<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img"><title>Overselling without an atomic update</title><desc>Request A and request B both read stock as 1 before either writes. A saves its order and sets stock to 0. B then saves its order based on the old reading and sets stock to minus 1. Two items were sold while only one was in stock.</desc><defs><marker id="arrow-oversell-without-atomic-update" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-purple"><rect x="50" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="120" y="36" text-anchor="middle" dominant-baseline="central">Request A</text></g>
<g class="c-teal"><rect x="270" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Database</text></g>
<g class="c-purple"><rect x="490" y="16" width="140" height="40" rx="8" stroke-width="0.5"/><text class="th" x="560" y="36" text-anchor="middle" dominant-baseline="central">Request B</text></g>
<line x1="120" y1="60" x2="120" y2="276" class="leader"/><line x1="340" y1="60" x2="340" y2="276" class="leader"/><line x1="560" y1="60" x2="560" y2="276" class="leader"/>
<line x1="124" y1="96" x2="336" y2="96" class="arr" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="230" y="90" text-anchor="middle">1. read stock</text>
<line x1="336" y1="124" x2="124" y2="124" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="230" y="118" text-anchor="middle">stock = 1</text>
<line x1="556" y1="164" x2="344" y2="164" class="arr" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="450" y="158" text-anchor="middle">2. read stock</text>
<line x1="344" y1="192" x2="556" y2="192" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="450" y="186" text-anchor="middle">stock = 1</text>
<line x1="124" y1="232" x2="336" y2="232" class="arr" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="230" y="226" text-anchor="middle">3. save order, stock = 0</text>
<line x1="556" y1="260" x2="344" y2="260" class="arr" marker-end="url(#arrow-oversell-without-atomic-update)"/><text class="ts" x="450" y="254" text-anchor="middle">4. save order, stock = -1</text>
<g class="c-coral"><rect x="250" y="290" width="180" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="305" text-anchor="middle" dominant-baseline="central">Oversold</text><text class="ts" x="340" y="322" text-anchor="middle" dominant-baseline="central">2 sold, 1 in stock</text></g></svg>
