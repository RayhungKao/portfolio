<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 250" role="img"><title>Five layers a request passes through</title><desc>A POST request to /api/orders passes through five numbered layers: routing, middleware, handler, service and data access. Middleware, handler and service can each stop the request early with an error status: 401 or 403, 400, or 409.</desc><defs><marker id="arrow-backend-request-lifecycle" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="18">POST /api/orders</text>
<text class="th" x="94" y="40" text-anchor="middle" dominant-baseline="central">1</text>
<text class="th" x="217" y="40" text-anchor="middle" dominant-baseline="central">2</text>
<text class="th" x="340" y="40" text-anchor="middle" dominant-baseline="central">3</text>
<text class="th" x="463" y="40" text-anchor="middle" dominant-baseline="central">4</text>
<text class="th" x="586" y="40" text-anchor="middle" dominant-baseline="central">5</text>
<g class="c-purple"><rect x="40" y="52" width="108" height="56" rx="8" stroke-width="0.5"/><text class="th" x="94" y="72" text-anchor="middle" dominant-baseline="central">Routing</text><text class="ts" x="94" y="90" text-anchor="middle" dominant-baseline="central">Which function?</text></g>
<g class="c-purple"><rect x="163" y="52" width="108" height="56" rx="8" stroke-width="0.5"/><text class="th" x="217" y="72" text-anchor="middle" dominant-baseline="central">Middleware</text><text class="ts" x="217" y="90" text-anchor="middle" dominant-baseline="central">Gate checks</text></g>
<g class="c-purple"><rect x="286" y="52" width="108" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="72" text-anchor="middle" dominant-baseline="central">Handler</text><text class="ts" x="340" y="90" text-anchor="middle" dominant-baseline="central">HTTP and shape</text></g>
<g class="c-purple"><rect x="409" y="52" width="108" height="56" rx="8" stroke-width="0.5"/><text class="th" x="463" y="72" text-anchor="middle" dominant-baseline="central">Service</text><text class="ts" x="463" y="90" text-anchor="middle" dominant-baseline="central">Business rules</text></g>
<g class="c-purple"><rect x="532" y="52" width="108" height="56" rx="8" stroke-width="0.5"/><text class="th" x="586" y="72" text-anchor="middle" dominant-baseline="central">Data access</text><text class="ts" x="586" y="90" text-anchor="middle" dominant-baseline="central">SQL or ORM</text></g>
<line x1="150" y1="80" x2="161" y2="80" class="arr" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="273" y1="80" x2="284" y2="80" class="arr" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="396" y1="80" x2="407" y2="80" class="arr" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="519" y1="80" x2="530" y2="80" class="arr" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="217" y1="112" x2="217" y2="148" class="arr" stroke="#D85A30" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="340" y1="112" x2="340" y2="148" class="arr" stroke="#D85A30" marker-end="url(#arrow-backend-request-lifecycle)"/>
<line x1="463" y1="112" x2="463" y2="148" class="arr" stroke="#D85A30" marker-end="url(#arrow-backend-request-lifecycle)"/>
<g class="c-coral"><rect x="163" y="152" width="108" height="44" rx="8" stroke-width="0.5"/><text class="th" x="217" y="167" text-anchor="middle" dominant-baseline="central">401 / 403</text><text class="ts" x="217" y="184" text-anchor="middle" dominant-baseline="central">Stop early</text></g>
<g class="c-coral"><rect x="286" y="152" width="108" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="167" text-anchor="middle" dominant-baseline="central">400</text><text class="ts" x="340" y="184" text-anchor="middle" dominant-baseline="central">Invalid input</text></g>
<g class="c-coral"><rect x="409" y="152" width="108" height="44" rx="8" stroke-width="0.5"/><text class="th" x="463" y="167" text-anchor="middle" dominant-baseline="central">409</text><text class="ts" x="463" y="184" text-anchor="middle" dominant-baseline="central">Rule broken</text></g>
<text class="ts" x="40" y="232">Coral: a layer can stop the request and return an error.</text></svg>
