<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" role="img"><title>Different credential types at each hop</title><desc>A browser sends a session cookie and a mobile app sends a bearer token to a gateway. The gateway checks them and passes an internal JWT to two services.</desc>
<defs><marker id="arrow-mixed-credentials-gateway" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-gray"><rect x="30" y="50" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="110" y="68" text-anchor="middle" dominant-baseline="central">Browser</text><text class="ts" x="110" y="88" text-anchor="middle" dominant-baseline="central">Session cookie</text></g>
<g class="c-gray"><rect x="30" y="140" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="110" y="158" text-anchor="middle" dominant-baseline="central">Mobile app</text><text class="ts" x="110" y="178" text-anchor="middle" dominant-baseline="central">Opaque or JWT token</text></g>
<g class="c-purple"><rect x="270" y="95" width="160" height="52" rx="8" stroke-width="0.5"/><text class="th" x="350" y="113" text-anchor="middle" dominant-baseline="central">Gateway / BFF</text><text class="ts" x="350" y="133" text-anchor="middle" dominant-baseline="central">Checks credential</text></g>
<g class="c-purple"><rect x="500" y="50" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="575" y="68" text-anchor="middle" dominant-baseline="central">Service A</text><text class="ts" x="575" y="88" text-anchor="middle" dominant-baseline="central">Checks internal JWT</text></g>
<g class="c-purple"><rect x="500" y="140" width="150" height="52" rx="8" stroke-width="0.5"/><text class="th" x="575" y="158" text-anchor="middle" dominant-baseline="central">Service B</text><text class="ts" x="575" y="178" text-anchor="middle" dominant-baseline="central">Checks internal JWT</text></g>
<line x1="190" y1="76" x2="268" y2="112" class="arr" marker-end="url(#arrow-mixed-credentials-gateway)"/>
<line x1="190" y1="166" x2="268" y2="130" class="arr" marker-end="url(#arrow-mixed-credentials-gateway)"/>
<line x1="430" y1="112" x2="498" y2="78" class="arr" marker-end="url(#arrow-mixed-credentials-gateway)"/>
<line x1="430" y1="130" x2="498" y2="164" class="arr" marker-end="url(#arrow-mixed-credentials-gateway)"/>
</svg>
