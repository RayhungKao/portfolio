<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" role="img"><title>Session and JWT login flows</title><desc>Two rows. With a session, the server creates a record in a session store, the browser holds a random session ID in a cookie, and the server looks the ID up in the store. With a JWT, the server signs a token that carries the user data using a secret key, the browser sends the token with each request, and the server verifies the signature with the same key and needs no store lookup.</desc><defs><marker id="arrow-session-vs-jwt-flows" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text class="th" x="40" y="24">Session: the cookie is just an ID</text>
<g class="c-gray"><rect x="40" y="38" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="58" text-anchor="middle" dominant-baseline="central">Login</text><text class="ts" x="107" y="76" text-anchor="middle" dominant-baseline="central">Credentials sent</text></g>
<g class="c-purple"><rect x="195" y="38" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="58" text-anchor="middle" dominant-baseline="central">Create session</text><text class="ts" x="262" y="76" text-anchor="middle" dominant-baseline="central">Random ID issued</text></g>
<g class="c-gray"><rect x="350" y="38" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="58" text-anchor="middle" dominant-baseline="central">Cookie</text><text class="ts" x="417" y="76" text-anchor="middle" dominant-baseline="central">Holds the ID only</text></g>
<g class="c-purple"><rect x="505" y="38" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="572" y="58" text-anchor="middle" dominant-baseline="central">Look up</text><text class="ts" x="572" y="76" text-anchor="middle" dominant-baseline="central">ID checked in store</text></g>
<line x1="179" y1="66" x2="191" y2="66" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="334" y1="66" x2="346" y2="66" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="489" y1="66" x2="501" y2="66" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="262" y1="98" x2="262" y2="116" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="572" y1="98" x2="572" y2="116" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<g class="c-teal"><rect x="195" y="120" width="445" height="32" rx="8" stroke-width="0.5"/><text class="ts" x="417" y="136" text-anchor="middle" dominant-baseline="central">Session store: Redis or a database, holds the user data</text></g>
<text class="th" x="40" y="190">JWT: the token carries the data</text>
<g class="c-gray"><rect x="40" y="204" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="107" y="224" text-anchor="middle" dominant-baseline="central">Login</text><text class="ts" x="107" y="242" text-anchor="middle" dominant-baseline="central">Credentials sent</text></g>
<g class="c-purple"><rect x="195" y="204" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="262" y="224" text-anchor="middle" dominant-baseline="central">Sign token</text><text class="ts" x="262" y="242" text-anchor="middle" dominant-baseline="central">User ID inside</text></g>
<g class="c-gray"><rect x="350" y="204" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="417" y="224" text-anchor="middle" dominant-baseline="central">Token</text><text class="ts" x="417" y="242" text-anchor="middle" dominant-baseline="central">Cookie or header</text></g>
<g class="c-purple"><rect x="505" y="204" width="135" height="56" rx="8" stroke-width="0.5"/><text class="th" x="572" y="224" text-anchor="middle" dominant-baseline="central">Verify</text><text class="ts" x="572" y="242" text-anchor="middle" dominant-baseline="central">No store lookup</text></g>
<line x1="179" y1="232" x2="191" y2="232" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="334" y1="232" x2="346" y2="232" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="489" y1="232" x2="501" y2="232" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="262" y1="264" x2="262" y2="282" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<line x1="572" y1="264" x2="572" y2="282" class="arr" marker-end="url(#arrow-session-vs-jwt-flows)"/>
<g class="c-teal"><rect x="195" y="286" width="445" height="32" rx="8" stroke-width="0.5"/><text class="ts" x="417" y="302" text-anchor="middle" dominant-baseline="central">Secret signing key: only the server has it</text></g>
<text class="ts" x="40" y="340">Session: delete the record to log out at once. JWT: valid until it expires.</text></svg>
